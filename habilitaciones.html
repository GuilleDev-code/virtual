<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habilitaciones para WhatsApp — Sistema UPG</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --primary: #0284c7;       
      --primary-hover: #0369a1;
      --success: #16a34a;       
      --danger: #dc2626;        
      --txt: #1f2937;
      --txt-muted: #4b5563;
      --border: #e5e7eb;
      --radius: 6px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--txt); padding: 24px; }

    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .header-title { font-size: 1.4rem; font-weight: 700; color: var(--txt); margin-bottom: 4px; }
    .header-sub { font-size: .88rem; color: var(--txt-muted); }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 300px; }
    .form-group label { font-size: .75rem; font-weight: 600; color: var(--txt-muted); text-transform: uppercase; letter-spacing: .05em; }
    select, input[type="number"] { 
      padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); 
      font-size: .9rem; background: var(--surface); outline: none; transition: border .2s;
    }
    select:focus, input:focus { border-color: var(--primary); }

    .btn {
      padding: 9px 16px; font-size: .88rem; font-weight: 600; border-radius: var(--radius);
      cursor: pointer; display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent;
      transition: background .2s, opacity .2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: white; }
    .btn-secondary { background: var(--surface); border-color: var(--border); color: var(--txt); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .table-wrap { overflow-x: auto; margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: .88rem; }
    th { background: #f9fafb; padding: 12px 16px; font-weight: 600; color: var(--txt-muted); border-bottom: 2px solid var(--border); text-transform: uppercase; font-size: .72rem; letter-spacing: .05em; }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:hover { background: #f9fafb; }

    .badge { padding: 2px 8px; border-radius: 12px; font-size: .75rem; font-weight: 600; display: inline-block; }
    .badge-success { background: #dcfce7; color: #15803d; }
    .badge-danger { background: #fee2e2; color: #b91c1c; }
    
    .input-table { width: 70px; padding: 4px 8px; text-align: center; }
    .obs-text { font-weight: 600; }
    .obs-alert { color: var(--danger); }
    .obs-ok { color: var(--success); }
  </style>
</head>
<body>

<div class="container">
  
  <div class="card">
    <div class="header-title">Control de Habilitaciones de Exámenes</div>
    <div class="header-sub">Cruce automático de rendimiento académico (Moodle) y estados de caja para reportes de WhatsApp.</div>
  </div>

  <div class="card">
    <div class="filter-bar">
      <div class="form-group">
        <label>Seleccionar Examen Activo del Calendario</label>
        <select id="selExamen">
          <option value="">Cargando exámenes vigentes...</option>
        </select>
      </div>
      <button id="btnBuscar" class="btn btn-primary">Buscar Alumnos</button>
      <button id="btnMoodle" class="btn btn-secondary" disabled>⚡ Sincronizar Moodle</button>
      <button id="btnPDF" class="btn btn-success" style="margin-left: auto;" disabled>📄 Exportar PDF para WhatsApp</button>
    </div>
  </div>

  <div class="card" id="tablaCard" style="display: none;">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width: 50px;">N°</th>
            <th>C.I.</th>
            <th>Alumno</th>
            <th style="text-align: center;">Puntaje Proceso</th>
            <th style="text-align: center;">Hab. Académica</th>
            <th style="text-align: center;">Estado Cuota</th>
            <th style="text-align: center;">Derecho Examen</th>
            <th>Observaciones Financieras/Académicas</th>
          </tr>
        </thead>
        <tbody id="tbodyAlumnos">
          </tbody>
      </table>
    </div>
  </div>

</div>

<script type="module">
    
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
  // ── Inicialización de Supabase con módulo ES6 ──
  const SUPABASE_URL = "https://dhamkbwoaswsxckudlmd.supabase.co"; 
  const SUPABASE_KEY = "sb_publishable_N5wBvz9PTzz4sSCemLyCnQ_XiFGmKhk"; 
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  let _examenActivo = null;
  let _listaAlumnos = [];

  window.addEventListener('DOMContentLoaded', async () => {
    await cargarCalendarioVigente();
    
    document.getElementById('btnBuscar').addEventListener('click', procesarFiltroAlumnos);
    document.getElementById('btnMoodle').addEventListener('click', sincronizarConMoodle);
    document.getElementById('btnPDF').addEventListener('click', exportarPlanillaPDF);
  });

  async function cargarCalendarioVigente() {
    // Traemos los exámenes vigentes junto a los datos del módulo/carrera si es posible
    const { data, error } = await supabase
      .from('calendario_examenes')
      .select('id, materia_id, cohorte_id, oportunidad_nro, materias(nombre), id_moodle')
      .eq('estado', 'VIGENTE');

    const select = document.getElementById('selExamen');
    select.innerHTML = '';

    if (error || !data || data.length === 0) {
      select.innerHTML = '<option value="">No hay exámenes vigentes en el calendario</option>';
      return;
    }

    data.forEach(ex => {
      const opt = document.createElement('option');
      opt.value = ex.id;
      opt.dataset.materia = ex.materia_id;
      opt.dataset.cohorte = ex.cohorte_id;
      opt.dataset.oportunidad = ex.oportunidad_nro;
      opt.dataset.nombreMateria = ex.materias.nombre;
      opt.dataset.idMoodle = ex.id_moodle;
      // Texto limpio descriptivo para la interfaz
      opt.textContent = `${ex.materias.nombre} — ${ex.oportunidad_nro}ª Oportunidad`;
      select.appendChild(opt);
    });
  }

async function procesarFiltroAlumnos() {
    const sel = document.getElementById('selExamen');
    if (!sel.value) return;

    const exId = sel.value;
    const cohorteId = sel.options[sel.selectedIndex].dataset.cohorte;
    const materiaId = sel.options[sel.selectedIndex].dataset.materia;
    const opNro = Number(sel.options[sel.selectedIndex].dataset.oportunidad);
    const textoExamen = sel.options[sel.selectedIndex].textContent;
    const idMoodle = sel.options[sel.selectedIndex].dataset.idMoodle;

    _examenActivo = { id: exId, cohorteId, materiaId, oportunidad: opNro, titulo: textoExamen, idMoodle: idMoodle};


    // Estirar los alumnos de la cohorte
    const { data: inscripciones, error } = await supabase
      .from('inscripciones_anuales')
      .select('id, alumno_id, alumnos(nombres, apellidos, ci)')
      .eq('cohorte_id', cohorteId);

    if (error || !inscripciones) { alert('Error al obtener lista de alumnos'); return; }

    _listaAlumnos = [];

    for (let ins of inscripciones) {
      const alumno = ins.alumnos;
      if (!alumno) continue;

      // ──────────────────────────────────────────────────────────────────────────
      // ⚡ EXCLUSIÓN DE ALUMNOS QUE YA APROBARON EN OPORTUNIDADES ANTERIORES ⚡
      // ──────────────────────────────────────────────────────────────────────────
      if (opNro > 1) {
        // Armamos un array con las oportunidades previas (ej: si es Op 3, busca en Op 1 y Op 2)
        const opsPrevias = Array.from({ length: opNro - 1 }, (_, i) => i + 1);

        const { data: aprobadoAntes } = await supabase
          .from('historial_examenes')
          .select('id')
          .eq('inscripcion_id', ins.id)
          .eq('materia_id', materiaId)
          .in('oportunidad_nro', opsPrevias)
          .or('estado_materia.eq.Aprobado,nota_obtenida.gte.2'); // Filtro por estado o nota mínima de aprobación py

        // Si ya registra aprobación en actas anteriores, saltamos al siguiente alumno
        if (aprobadoAntes && aprobadoAntes.length > 0) {
          continue; 
        }
      }
      // ──────────────────────────────────────────────────────────────────────────

      // Supongamos que asociamos el módulo actual a su número de cuota correspondiente
      const cuotaMapeada = 12; 

      // 1. Verificación de Cuota en caja
      const { data: cuotas } = await supabase
        .from('cuotas_pagos')
        .select('estado_pago')
        .eq('inscripcion_id', ins.id)
        .eq('nro_cuota', cuotaMapeada)
        .eq('estado_pago', 'Pagado');

      const tieneCuotaAlDia = (cuotas && cuotas.length > 0);

      // 2. Verificación de arancel de Derecho de Examen
      const { data: derechos } = await supabase
        .from('derechos_examen')
        .select('id')
        .eq('inscripcion_id', ins.id)
        .eq('materia_id', materiaId)
        .eq('oportunidad_nro', opNro);

      const tieneDerechoPagado = (derechos && derechos.length > 0);

      _listaAlumnos.push({
        inscripcionId: ins.id,
        ci: alumno.ci,
        nombreCompleto: `${alumno.apellidos}, ${alumno.nombres}`,
        puntajeProceso: 0,
        habilitadoAcademico: false,
        cuotaAlDia: tieneCuotaAlDia,
        derechoExamen: tieneDerechoPagado,
        observacion: ''
      });
    }

    document.getElementById('btnMoodle').disabled = false;
    document.getElementById('btnPDF').disabled = false;
    document.getElementById('tablaCard').style.display = 'block';
    
    recalcularYRenderizarTabla();
  }

// ── Configuración de Moodle (Reemplazar con tus datos reales) ──
  const MOODLE_URL = "https://mooc.uniupg.edu.py"; 
  const MOODLE_TOKEN = "f783afebb75d1529ce29dcafcfa4b427";
  const MINIMO_APROBACION_PROCESO = 50; // Ajustar según la regla académica de la cohorte

  async function sincronizarConMoodle() {
    if (!_examenActivo) {
      alert("Por favor, primero busca los alumnos de un examen vigente.");
      return;
    }

    const btn = document.getElementById('btnMoodle');
    const txtOriginal = btn.textContent;
    btn.disabled = true;
    btn.textContent = "⚡ Conectando a Moodle...";

    try {
      // 1. Apuntamos al endpoint del Web Service de Moodle (formato JSON)
      // Usamos el 'materiaId' de Supabase mapeado como el ID de Curso en Moodle
      const urlWS = `${MOODLE_URL}/webservice/rest/server.php`
        + `?wstoken=${MOODLE_TOKEN}`
        + `&wsfunction=gradereport_user_get_grade_items`
        + `&courseid=${_examenActivo.idMoodle}`
        + `&moodlewsrestformat=json`;

      const response = await fetch(urlWS);
      if (!response.ok) throw new Error("Error en la respuesta del servidor Moodle");
      
      const resData = await response.json();

      // Verificar si Moodle retornó una estructura válida o un error de token/permisos
      if (resData.exception) {
        throw new Error(`Moodle Exception: ${resData.message}`);
      }

      // 2. Moodle nos devuelve un array por usuario ('usergrades')
      const calificacionesMoodle = resData.usergrades || [];
      console.log(calificacionesMoodle)
      /*
      if (calificacionesMoodle.length === 0) {
        alert("Sincronización exitosa, pero no se encontraron alumnos o calificaciones en este curso de Moodle.");
        btn.disabled = false;
        btn.textContent = txtOriginal;
        return;
      }

      // 3. Cruzamos la información estirada de Moodle con nuestro borrador "en sucio"
      _listaAlumnos.forEach(al => {
        // Buscamos en el JSON de Moodle el usuario que coincida con la C.I. del alumno (campo 'idnumber' o 'username' en Moodle)
        const matchMoodle = calificacionesMoodle.find(u => 
          u.idnumber === al.ci || u.username === al.ci
        );

        if (matchMoodle) {
          // Buscamos el ítem de calificación que represente la nota total del proceso del módulo
          // Normalmente se llama 'course' o el nombre de la categoría del total del libro de calificaciones
          const totalItem = matchMoodle.gradeitems.find(item => item.itemtype === 'course');
          
          if (totalItem && totalItem.graderaw !== null) {
            const notaProceso = Number(totalItem.graderaw);
            
            al.puntajeProceso = notaProceso;
            // Automatización: Prende el check académico solo si el puntaje real de Moodle da la nota mínima
            al.habilitadoAcademico = notaProceso >= MINIMO_APROBACION_PROCESO;
          }
        }
      });

      alert(`¡Sincronización completa! Se procesaron ${calificacionesMoodle.length} registros desde Moodle.`);
    */
    } catch (err) {
      console.error("Fallo de conexión Moodle API:", err);
      alert(`No se pudo conectar al Moodle: ${err.message}\n(Revisá si las credenciales son correctas o problemas de CORS en el servidor)`);
    } finally {
      // Devolvemos el botón a su estado normal
      btn.disabled = false;
      btn.textContent = txtOriginal;
      // Refrescamos la pantalla al instante con las notas e impactos reales
      recalcularYRenderizarTabla();
    }
  }

  function recalcularYRenderizarTabla() {
    const tbody = document.getElementById('tbodyAlumnos');
    tbody.innerHTML = '';

    _listaAlumnos.forEach((al, index) => {
      
      // Matriz de decisiones idéntica a tus planillas oficiales
      if (!al.habilitadoAcademico) {
        al.observacion = "No habilitado académicamente por puntaje";
      } else if (!al.cuotaAlDia && !al.derechoExamen) {
        al.observacion = "No abonó cuota ni derecho";
      } else if (al.cuotaAlDia && !al.derechoExamen) {
        al.observacion = "No abonó derecho";
      } else if (!al.cuotaAlDia && al.derechoExamen) {
        al.observacion = "No abonó cuota";
      } else {
        al.observacion = ""; // APTO
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td><b>${al.ci}</b></td>
        <td>${al.nombreCompleto}</td>
        <td style="text-align: center;">
          <input type="number" class="input-table" value="${al.puntajeProceso}" data-index="${index}" onchange="window.cambioPuntaje(this)">
        </td>
        <td style="text-align: center;">
          <input type="checkbox" ${al.habilitadoAcademico ? 'checked' : ''} data-index="${index}" onchange="window.cambioHabilitacion(this)">
        </td>
        <td style="text-align: center;">
          <span class="badge ${al.cuotaAlDia ? 'badge-success' : 'badge-danger'}">${al.cuotaAlDia ? 'PAGADO' : 'ATRASADO'}</span>
        </td>
        <td style="text-align: center;">
          <span class="badge ${al.derechoExamen ? 'badge-success' : 'badge-danger'}">${al.derechoExamen ? 'PAGADO' : 'PENDIENTE'}</span>
        </td>
        <td>
          <span class="obs-text ${al.observacion ? 'obs-alert' : 'obs-ok'}">
            ${al.observacion || '✓ APTO PARA RENDIR'}
          </span>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  // Al usar type="module", debemos exponer las funciones a "window" para los "onchange" del HTML
  window.cambioPuntaje = function(input) {
    const idx = input.dataset.index;
    _listaAlumnos[idx].puntajeProceso = Number(input.value);
    recalcularYRenderizarTabla();
  }

  window.cambioHabilitacion = function(checkbox) {
    const idx = checkbox.dataset.index;
    _listaAlumnos[idx].habilitadoAcademico = checkbox.checked;
    recalcularYRenderizarTabla();
  }

  function exportarPlanillaPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'pt', 'a4');

    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("UNIVERSIDAD PRIVADA DEL GUAIRÁ", 30, 40);
    
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text("Planilla de Control de Habilitaciones Académicas y Financieras", 30, 56);
    doc.text(`Examen Vigente: ${_examenActivo.titulo}`, 30, 70);

    const rows = _listaAlumnos.map((al, idx) => [
      idx + 1,
      al.ci,
      al.nombreCompleto,
      al.puntajeProceso,
      al.habilitadoAcademico ? 'SI' : 'NO',
      al.cuotaAlDia ? 'SI' : 'NO',
      al.derechoExamen ? 'SI' : 'NO',
      al.observacion || 'APTO'
    ]);

    doc.autoTable({
      startY: 85,
      head: [['N°', 'C.I.', 'Alumno', 'Proceso', 'Hab. Acad', 'Cuota', 'Derecho', 'Observaciones']],
      body: rows,
      theme: 'grid',
      headStyles: { fillColor: [2, 132, 199], textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8 },
      bodyStyles: { fontSize: 8 },
      columnStyles: {
        3: { halign: 'center' },
        4: { halign: 'center' },
        5: { halign: 'center' },
        6: { halign: 'center' },
      },
      didParseCell: function(data) {
        if (data.section === 'body' && data.column.index === 7) {
          const val = data.cell.raw;
          if (val !== 'APTO') {
            data.cell.styles.textColor = [220, 38, 38]; 
            data.cell.styles.fontStyle = 'bold';
          } else {
            data.cell.styles.textColor = [22, 163, 74];  
          }
        }
      }
    });

    doc.save(`Planilla_WhatsApp_Op_${_examenActivo.oportunidad}.pdf`);
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exámenes — Sistema UPG</title>
  <link rel="stylesheet" href="assets/styles.css">
    <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    /* ── Layout ── */
    .ex-wrap    { display:flex; flex-direction:column; height:calc(100vh - var(--topbar-h)); overflow:hidden; }
    .ex-tabs    { display:flex; padding:0 24px; background:var(--surface); border-bottom:2px solid var(--border); flex-shrink:0; }
    .ex-tab     { padding:12px 18px; font-size:.86rem; font-weight:500; color:var(--txt-secondary); border-bottom:2px solid transparent; margin-bottom:-2px; transition:all var(--transition); white-space:nowrap; }
    .ex-tab:hover  { color:var(--verde); }
    .ex-tab.active { color:var(--verde); border-bottom-color:var(--verde); font-weight:600; }
    .ex-content { flex:1; overflow-y:auto; padding:20px 24px; }

    /* ── Toolbar selectores ── */
    .sel-toolbar { display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
    .sel-group   { display:flex; flex-direction:column; gap:4px; }
    .sel-label   { font-size:.68rem; font-weight:700; color:var(--txt-muted); text-transform:uppercase; letter-spacing:.07em; }

    /* ── Tabla habilitados ── */
    .hab-table-wrap { overflow-x:auto; }
    .hab-table { width:100%; border-collapse:collapse; font-size:.8rem; }
    .hab-table th {
      background:var(--surface-2); color:var(--txt-muted);
      font-size:.67rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
      padding:9px 10px; white-space:nowrap; border-bottom:2px solid var(--border);
      position:sticky; top:0; z-index:2;
    }
    .hab-table td { padding:8px 10px; border-bottom:1px solid var(--border-light); vertical-align:middle; }
    .hab-table tr:hover td { background:var(--surface-2); }
    .hab-table tr.excluido td { opacity:.4; text-decoration:line-through; }
    .hab-table tr.excluido td:last-child { opacity:1; text-decoration:none; }

    /* Celda puntaje */
    .inp-puntaje {
      width:60px; padding:4px 6px; text-align:center;
      border:1.5px solid var(--border); border-radius:var(--radius-sm);
      font-size:.82rem; font-weight:600; background:var(--surface);
      outline:none; transition:border-color .15s;
    }
    .inp-puntaje:focus { border-color:var(--verde); box-shadow:0 0 0 2px rgba(26,107,60,.1); }
    .inp-puntaje:disabled { background:var(--surface-2); color:var(--txt-muted); }

    /* Celda checkbox habilitado */
    .chk-hab { width:18px; height:18px; accent-color:var(--verde); cursor:pointer; }

    /* Botón sync GoodSystem */
    .btn-sync {
      display:inline-flex; align-items:center; gap:4px;
      padding:3px 8px; border-radius:var(--radius-sm); border:1.5px dashed #d97706;
      background:#fef3c7; color:#92400e; font-size:.68rem; font-weight:700;
      cursor:pointer; transition:all .15s; white-space:nowrap;
    }
    .btn-sync:hover { background:#d97706; color:#fff; border-color:#d97706; border-style:solid; }
    .btn-sync:disabled { opacity:.5; cursor:wait; }
    .btn-sync.cargando { opacity:.6; cursor:wait; }

    /* Indicador pagado/no pagado */
    .ind { display:inline-flex; align-items:center; justify-content:center;
           width:22px; height:22px; border-radius:50%; font-size:.78rem; font-weight:700; }
    .ind.si  { background:#dcfce7; color:#16a34a; }
    .ind.no  { background:#fee2e2; color:#dc2626; }
    .ind.nd  { background:#f3f4f6; color:#9ca3af; }

    /* Botón excluir */
    .btn-excluir {
      width:24px; height:24px; border-radius:50%; border:none;
      background:var(--surface-2); color:var(--txt-muted);
      font-size:.78rem; cursor:pointer; display:inline-flex;
      align-items:center; justify-content:center; transition:all .15s;
    }
    .btn-excluir:hover { background:#fee2e2; color:#dc2626; }
    .btn-excluir.incluir { background:#dcfce7; color:#16a34a; }
    .btn-excluir.incluir:hover { background:#16a34a; color:#fff; }

    /* Obs input */
    .inp-obs {
      width:100%; min-width:140px; padding:4px 6px;
      border:1.5px solid transparent; border-radius:var(--radius-sm);
      font-size:.75rem; background:transparent; outline:none;
      transition:border-color .15s;
    }
    .inp-obs:focus { border-color:var(--verde); background:var(--surface); }

    /* Stats bar */
    .stats-bar {
      display:flex; gap:16px; flex-wrap:wrap;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:12px 16px; margin-bottom:16px;
    }
    .stat-item { text-align:center; }
    .stat-item .val { font-size:1.3rem; font-weight:700; color:var(--verde); }
    .stat-item .lbl { font-size:.65rem; color:var(--txt-muted); text-transform:uppercase; letter-spacing:.05em; }

    /* Toolbar acciones tabla */
    .table-actions { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }

    /* ── MODAL DOCUMENTO ── */
    .modal-doc { max-width:780px; width:95vw; }
    .doc-preview {
      font-family:'Segoe UI', sans-serif;
      font-size:11px; color:#000;
    }
    .doc-header-inst {
      text-align:center; border-bottom:2px solid #06402b;
      padding-bottom:10px; margin-bottom:14px;
    }
    .doc-inst-nombre {
      font-size:13px; font-weight:700; color:#06402b; text-transform:uppercase;
    }
    .doc-inst-sub { font-size:10px; color:#444; margin-top:2px; }
    .doc-titulo-bloque {
      background:#06402b; color:#fff;
      text-align:center; padding:6px 12px;
      font-size:11px; font-weight:700; text-transform:uppercase;
      letter-spacing:.05em; border-radius:4px 4px 0 0;
      margin-bottom:0;
    }
    .doc-subtitulo-bloque {
      background:#e8f5ef; border:1px solid #b8d8c6;
      text-align:center; padding:4px 12px;
      font-size:11px; font-weight:700; color:#06402b;
      text-transform:uppercase; border-radius:0 0 4px 4px;
      margin-bottom:12px;
    }
    .doc-table { width:100%; border-collapse:collapse; font-size:10px; }
    .doc-table th {
      background:#06402b; color:#fff; padding:5px 6px;
      font-size:9px; font-weight:700; text-transform:uppercase;
      letter-spacing:.04em; border:1px solid #055030;
    }
    .doc-table td { padding:4px 6px; border:1px solid #ccc; vertical-align:middle; }
    .doc-table tr:nth-child(even) td { background:#f0faf4; }
    .doc-table .centro { text-align:center; }
    .doc-table .si-cell { background:#dcfce7!important; color:#16a34a; font-weight:700; text-align:center; }
    .doc-table .no-cell { background:#fee2e2!important; color:#dc2626; font-weight:700; text-align:center; }
    .doc-footer {
      margin-top:16px; display:flex; justify-content:space-between;
      font-size:9px; color:#666; border-top:1px solid #ccc; padding-top:6px;
    }

    /* Historial tab */
    .hist-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:16px; margin-bottom:10px;
      cursor:pointer; transition:all .15s;
    }
    .hist-card:hover { border-color:var(--verde); box-shadow:0 2px 8px rgba(26,107,60,.08); }
    .hist-card-title { font-size:.88rem; font-weight:700; margin-bottom:4px; }
    .hist-card-meta  { font-size:.75rem; color:var(--txt-muted); display:flex; gap:12px; flex-wrap:wrap; }
    .hist-card-stats { display:flex; gap:8px; margin-top:8px; }
  </style>
</head>
<body>
<div class="app-layout">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">Exámenes</div>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <div class="ex-wrap">
      <div class="ex-tabs">
        <button class="ex-tab active" data-tab="habilitacion">Habilitación</button>
        <button class="ex-tab" data-tab="historial">Historial</button>
      </div>

      <div class="ex-content">

        <!-- ── HABILITACIÓN ────────────────────────── -->
        <div id="tab-habilitacion">
          <div class="sel-toolbar">
            <div class="sel-group">
              <div class="sel-label">Carrera</div>
              <select class="form-control" id="selCarrera" style="width:240px">
                <option value="">Seleccionar carrera...</option>
              </select>
            </div>
            <div class="sel-group">
              <div class="sel-label">Cohorte</div>
              <select class="form-control" id="selCohorte" style="width:200px" disabled>
                <option value="">Primero seleccioná carrera</option>
              </select>
            </div>
            <div class="sel-group">
              <div class="sel-label">Examen</div>
              <select class="form-control" id="selCalendario" style="width:300px" disabled>
                <option value="">Primero seleccioná cohorte</option>
              </select>
            </div>
            <button class="btn btn-ghost btn-sm" id="btnCargar" disabled style="margin-bottom:1px">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              Cargar
            </button>
          </div>

          <div id="habContent">
            <div style="text-align:center;padding:60px;color:var(--txt-muted);font-size:.85rem">
              Seleccioná carrera, cohorte y examen para cargar la lista
            </div>
          </div>
        </div>

        <!-- ── HISTORIAL ───────────────────────────── -->
        <div id="tab-historial" style="display:none">
          <div class="toolbar" style="margin-bottom:16px">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="text" class="form-control" id="searchHist" placeholder="Buscar materia...">
            </div>
            <select class="form-control" id="filtroCarreraHist" style="width:auto">
              <option value="">Todas las carreras</option>
            </select>
            <span id="histTotal" style="font-size:.78rem;color:var(--txt-muted);margin-left:auto"></span>
          </div>
          <div id="histContent">
            <div style="text-align:center;padding:40px;color:var(--txt-muted)">Cargando...</div>
          </div>
        </div>

      </div><!-- /ex-content -->
    </div>

  </div>
</div>

<!-- ── Modal pagos ── -->
<div class="modal-overlay" id="modalPagosOverlay">
  <div class="modal" style="max-width:580px;width:95vw">
    <div class="modal-header">
      <div>
        <span class="modal-title" id="modalPagosTitle">Pagos del alumno</span>
        <div style="font-size:.78rem;color:var(--txt-muted);margin-top:2px" id="modalPagosSub"></div>
      </div>
      <button class="modal-close" onclick="document.getElementById('modalPagosOverlay').classList.remove('open')">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalPagosBody" style="overflow-y:auto;max-height:70vh;padding:0"></div>
  </div>
</div>

<!-- ── Modal documento ── -->
<div class="modal-overlay" id="modalDocOverlay">
  <div class="modal modal-doc">
    <div class="modal-header">
      <span class="modal-title">Vista previa del documento</span>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary btn-sm" onclick="imprimirDoc()">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Imprimir / PDF
        </button>
        <button class="modal-close" onclick="document.getElementById('modalDocOverlay').classList.remove('open')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="modal-body" id="modalDocBody" style="overflow-y:auto;max-height:75vh"></div>
  </div>
</div>

<div id="toast-container"></div>

<script type="module">
import { supabase, formatFechaHora, toast } from './assets/supabase.js';


import { requireAuth } from './assets/auth.js';
import { initSidebar } from './assets/sidebar.js';

const sesion = requireAuth('examenes');
if (!sesion) throw new Error('Sin sesión');
initSidebar('examenes');

// ── Estado ────────────────────────────────────────────────────
let filas = [];       // [{alumno, inscripcion, cuotaPagada, derechoPagado, habAcad, puntaje, obs, excluido}]
let calendarioActivo = null;
let cohorteActivo    = null;
let carreraActiva    = null;
let historial        = [];

// ── Tabs ──────────────────────────────────────────────────────
document.querySelectorAll('.ex-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ex-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-habilitacion').style.display = btn.dataset.tab === 'habilitacion' ? 'block' : 'none';
    document.getElementById('tab-historial').style.display    = btn.dataset.tab === 'historial'    ? 'block' : 'none';
    if (btn.dataset.tab === 'historial' && !historial.length) cargarHistorial();
  });
});

// ── Config Moodle ─────────────────────────────────────────────



// ── Init ──────────────────────────────────────────────────────
await cargarCarreras();

// ── Selectores en cascada ─────────────────────────────────────
async function cargarCarreras() {
  const { data } = await supabase.from('carreras').select('id,nombre').eq('estado','Activa').order('nombre');
  const opts = (data||[]).map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
  document.getElementById('selCarrera').innerHTML = '<option value="">Seleccionar carrera...</option>' + opts;
  document.getElementById('filtroCarreraHist').innerHTML = '<option value="">Todas las carreras</option>' + opts;
}

document.getElementById('selCarrera').addEventListener('change', async e => {
  const carreraId = e.target.value;
  const selCoh = document.getElementById('selCohorte');
  const selCal = document.getElementById('selCalendario');
  selCoh.innerHTML = '<option value="">Seleccionar cohorte...</option>';
  selCal.innerHTML = '<option value="">Primero seleccioná cohorte</option>';
  selCoh.disabled = !carreraId;
  selCal.disabled = true;
  document.getElementById('btnCargar').disabled = true;
  carreraActiva = carreraId;
  if (!carreraId) return;

  const { data } = await supabase.from('cohortes')
    .select('id,nro_cohorte,anho_inicio')
    .eq('carrera_id', carreraId).order('nro_cohorte');
  (data||[]).forEach(c => {
    selCoh.innerHTML += `<option value="${c.id}">${c.nro_cohorte}ª Cohorte ${c.anho_inicio}</option>`;
  });
});

document.getElementById('selCohorte').addEventListener('change', async e => {
  const cohorteId = e.target.value;
  const selCal = document.getElementById('selCalendario');
  selCal.innerHTML = '<option value="">Sin exámenes para esta cohorte</option>';
  selCal.disabled = !cohorteId;
  document.getElementById('btnCargar').disabled = true;
  cohorteActivo = cohorteId;
  if (!cohorteId) return;

  const { data } = await supabase.from('calendario_examenes')
    .select('id,oportunidad_nro,materia_id,fecha_desde,fecha_hasta,estado,materias(nombre,anho_curricula)')
    .eq('cohorte_id', cohorteId)
    .order('materia_id');

  if (!data?.length) return;
  selCal.innerHTML = '<option value="">Seleccionar examen...</option>';
  data.forEach(c => {
    const estado = c.estado === 'VIGENTE' ? ' ✓' : '';
    selCal.innerHTML += `<option value="${c.id}">${c.materias?.nombre} — ${c.oportunidad_nro}ª oport.${estado}</option>`;
  });
  selCal.disabled = false;
});

document.getElementById('selCalendario').addEventListener('change', e => {
  document.getElementById('btnCargar').disabled = !e.target.value;
});

document.getElementById('btnCargar').addEventListener('click', cargarLista);

// ── Cargar lista principal ─────────────────────────────────────
async function cargarLista() {
  const calendarioId = document.getElementById('selCalendario').value;
  const cohorteId    = document.getElementById('selCohorte').value;
  const carreraId    = document.getElementById('selCarrera').value;
  if (!calendarioId || !cohorteId) return;

  document.getElementById('habContent').innerHTML =
    '<div style="text-align:center;padding:40px;color:var(--txt-muted)">Cargando alumnos...</div>';

  // 1. Datos del calendario seleccionado
  const { data: cal } = await supabase.from('calendario_examenes')
    .select('id,oportunidad_nro,fecha_desde,fecha_hasta,estado,materia_id,id_moodle,materias(nombre,anho_curricula,cuota_requerida_examen)')
    .eq('id', calendarioId).single();
  calendarioActivo = cal;


  // 2. Todos los alumnos activos de la cohorte con sus inscripciones
  const { data: inscs } = await supabase.from('inscripciones_anuales')
    .select('id,anho_cursada,alumnos(id,nombres,apellidos,ci,telefono)')
    .eq('cohorte_id', cohorteId)
    .eq('estado','Activo')
    .order('alumnos(apellidos)');

  if (!inscs?.length) {
    document.getElementById('habContent').innerHTML =
      '<div style="text-align:center;padding:40px;color:var(--txt-muted)">Sin alumnos activos en esta cohorte</div>';
    return;
  }

  // Excluir alumnos que ya aprobaron en oportunidades anteriores
  let inscsFiltradas = inscs;
  if (cal.oportunidad_nro > 1) {
    const opsPrevias = Array.from({ length: cal.oportunidad_nro - 1 }, (_, i) => i + 1);
    const inscIds0   = inscs.map(i => i.id);
    const { data: aprobados } = await supabase.from('historial_examenes')
      .select('inscripcion_id')
      .eq('materia_id', cal.materia_id)
      .in('oportunidad_nro', opsPrevias)
      .in('inscripcion_id', inscIds0)
      .or('estado_materia.eq.Aprobado,nota_obtenida.gte.2');
    const aprobadosSet = new Set((aprobados||[]).map(a => a.inscripcion_id));
    inscsFiltradas = inscs.filter(i => !aprobadosSet.has(i.id));
  }

  const inscIds = inscsFiltradas.map(i => i.id);
  if (!inscIds.length) {
    document.getElementById('habContent').innerHTML =
      '<div style="text-align:center;padding:40px;color:var(--txt-muted)">Todos los alumnos ya aprobaron en oportunidades anteriores</div>';
    return;
  }

  // 3. Cuotas pendientes/vencidas — guardamos el id para poder actualizarlas
  const { data: cuotas } = await supabase.from('cuotas_pagos')
    .select('id,inscripcion_id,estado_pago,nro_cuota,monto_final')
    .in('inscripcion_id', inscIds)
    .eq('nro_cuota',calendarioActivo.materias.cuota_requerida_examen)
    .order('nro_cuota', { ascending: false });

  // Mapa: inscripcion_id → {pagada, cuota_id, monto}
  const cuotaMap = {};
  (cuotas||[]).forEach(c => {
    if (!cuotaMap[c.inscripcion_id]) {
      cuotaMap[c.inscripcion_id] = {
        pagada:   c.estado_pago === 'Pagado',
        cuota_id: c.id,
        monto:    c.monto_final,
        nro:      c.nro_cuota,
      };
    }
  });

  // 4. Derechos de examen para esta materia + oportunidad
  const { data: derechos } = await supabase.from('derechos_examen')
    .select('inscripcion_id')
    .eq('materia_id', cal.materia_id)
    .eq('oportunidad_nro', cal.oportunidad_nro)
    .eq('estado','PAGADO')
    .in('inscripcion_id', inscIds);

  const derechoSet = new Set((derechos||[]).map(d => d.inscripcion_id));

  // 4b. Precio del derecho de examen según oportunidad
  const { data: precioConf } = await supabase.from('configuracion_precios')
    .select('monto_examen_1ra,monto_examen_2da,monto_examen_3ra,monto_examen_extraordinario')
    .eq('carrera_id', carreraId)
    .order('anho_lectivo', { ascending: false })
    .limit(1)
    .maybeSingle();

  const MONTO_EXAMEN_MAP = {
    1: precioConf?.monto_examen_1ra,
    2: precioConf?.monto_examen_2da,
    3: precioConf?.monto_examen_3ra,
    4: precioConf?.monto_examen_extraordinario,
  };
  const montoExamen = MONTO_EXAMEN_MAP[cal.oportunidad_nro] || 0;
  // Guardarlo en el calendario activo para usarlo en sincronizar
  cal._montoExamen = montoExamen;

  // 5. Historial previo (si ya se cargó esta lista antes)
  const { data: histPrev } = await supabase.from('historial_examenes')
    .select('id,inscripcion_id,estado_materia,nota_obtenida,hab_academico,hab_administrativo,calif_proceso,calif_examen_final')
    .eq('materia_id', cal.materia_id)
    .eq('oportunidad_nro', cal.oportunidad_nro)
    .in('inscripcion_id', inscIds);

  const histMap = {};
  (histPrev||[]).forEach(h => { histMap[h.inscripcion_id] = h; });

  filas = inscsFiltradas.map(ins => {
    const al      = ins.alumnos;
    const cq      = cuotaMap[ins.id];
    const cuota   = cq?.pagada ?? false;
    const derecho = derechoSet.has(ins.id);
    const prev    = histMap[ins.id];
    // hab_administrativo = cuota pagada Y derecho pagado (o lo que ya está guardado en historial)
    const habAdmin = cuota && derecho;
    // Si ya hay historial guardado, respetar el valor persistido (puede haberse pagado en caja física)
    const habAdminFinal = prev?.hab_administrativo ?? habAdmin;
    let obs = '';
    if (!cuota && !derecho) obs = 'No abonó cuota ni derecho';
    else if (!cuota)        obs = 'No abonó cuota';
    else if (!derecho)      obs = 'No abonó derecho';
    return {
      inscripcion_id: ins.id,
      alumno_id:      al?.id,
      ci:             al?.ci || '—',
      nombre:         al ? `${al.nombres} ${al.apellidos}` : '—',
      telefono:       al?.telefono || '',
      cuotaPagada:    cuota,
      cuota_id:       cq?.cuota_id ?? null,
      cuota_monto:    cq?.monto ?? 0,
      cuota_nro:      cq?.nro ?? null,
      derechoPagado:  derecho,
      habAdmin:       habAdminFinal,
      habAcad:        prev?.hab_academico ?? false,
      puntaje:        prev?.calif_proceso ?? '',
      obs,
      excluido:       false,
      historial_id:   prev?.id ?? null,
    };
  });

  renderTabla();
  actualizarTopbar();
}

// ── Render tabla ───────────────────────────────────────────────
function renderTabla() {

  const noHab       = filas.filter(f => !f.excluido && (!f.habAcad || !f.cuotaPagada || !f.derechoPagado)).length;
  const excluidos   = filas.filter(f => f.excluido).length;
  const total       = filas.filter(f => !f.excluido).length;

  document.getElementById('habContent').innerHTML = `
    <div class="stats-bar">
      <div class="stat-item"><div class="val">${total}</div><div class="lbl">Total</div></div>
      <div class="stat-item"><div class="val" style="color:#16a34a">${habilitados}</div><div class="lbl">Habilitados</div></div>
      <div class="stat-item"><div class="val" style="color:#dc2626">${noHab}</div><div class="lbl">No habilitados</div></div>
      ${excluidos ? `<div class="stat-item"><div class="val" style="color:var(--txt-muted)">${excluidos}</div><div class="lbl">Excluidos</div></div>` : ''}

      <button class="btn btn-ghost btn-sm" onclick="limpiarHab()">Limpiar selección</button>
      <button class="btn btn-primary btn-sm" id="btnGuardar" onclick="guardarHabilitaciones()">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Guardar
      </button>
      <button class="btn btn-ghost btn-sm" onclick="abrirDocumento()">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Ver documento
      </button>

    <div class="hab-table-wrap">
      <table class="hab-table">
        <thead>
          <tr>
            <th style="width:36px">Nº</th>
            <th>CI</th>
            <th>Nombre</th>
            <th style="text-align:center;width:70px">Puntaje</th>
            <th style="text-align:center;width:80px">Hab. Acad.</th>
            <th style="text-align:center;width:80px">Pagos</th>

}

function renderFila(f, i) {
  const n = filas.filter((x, j) => !x.excluido && j <= i).length;
  // Columna cuota+derecho: si alguno falta, mostrar botón que abre el modal de pagos
  const pagosOk  = f.cuotaPagada && f.derechoPagado;
  const pagosBadge = pagosOk
    ? `<span class="ind si" title="Cuota y derecho abonados">✓</span>`
    : f.excluido
      ? `<span class="ind no">—</span>`
      : `<button class="btn-sync" onclick="abrirModalPagos(${i})" title="Ver pagos · ${!f.cuotaPagada?'Falta cuota':''}${!f.cuotaPagada&&!f.derechoPagado?' y ':''}${!f.derechoPagado?'Falta derecho':''}">
           <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
           Pagos
         </button>`;

  return `<tr id="fila_${i}" class="${f.excluido ? 'excluido' : ''}">
    <td class="td-mono" style="font-size:.7rem;color:var(--txt-muted)">${f.excluido ? '—' : n}</td>
    <td class="td-mono">${f.ci}</td>
    <td style="font-weight:600">${f.nombre}</td>
    <td style="text-align:center">
      <input class="inp-puntaje" type="number" min="0" max="100" step="1"
        value="${f.puntaje}" ${f.excluido ? 'disabled' : ''}
        onchange="filas[${i}].puntaje = Number(this.value); actualizarObs(${i})">
    </td>
    <td style="text-align:center">
      <input type="checkbox" class="chk-hab" ${f.habAcad ? 'checked' : ''} ${f.excluido ? 'disabled' : ''}
        onchange="filas[${i}].habAcad = this.checked; actualizarObs(${i}); refreshFila(${i})">
    </td>
    <td style="text-align:center">${pagosBadge}</td>
    <td>
      <input class="inp-obs" type="text" value="${f.obs}" placeholder="—"
        onchange="filas[${i}].obs = this.value">
    </td>
    <td>
      <button class="btn-excluir ${f.excluido ? 'incluir' : ''}"
        title="${f.excluido ? 'Incluir' : 'Excluir'}"
        onclick="toggleExcluir(${i})">
        ${f.excluido ? '↩' : '✕'}
      </button>
    </td>
  </tr>`;
}

// ── Acciones de tabla ──────────────────────────────────────────
window.toggleExcluir = (i) => {
  filas[i].excluido = !filas[i].excluido;
  renderTabla();
};

window.habilitarTodos = () => {
  filas.forEach(f => { if (!f.excluido) f.habAcad = true; });
  renderTabla();
};

window.limpiarHab = () => {
  filas.forEach(f => { f.habAcad = false; });
  renderTabla();
};

window.actualizarObs = (i) => {
  const f = filas[i];
  if (!f.excluido) {
    let obs = '';
    if (!f.cuotaPagada && !f.derechoPagado) obs = 'No abonó cuota ni derecho';
    else if (!f.cuotaPagada)  obs = 'No abonó cuota';
    else if (!f.derechoPagado) obs = 'No abonó derecho';
    if (obs) filas[i].obs = obs;
    // Actualizar input obs sin re-render completo
    const obsInput = document.querySelector(`#fila_${i} .inp-obs`);
    if (obsInput && obs) obsInput.value = obs;
  }
};

window.refreshFila = (i) => {
  const tr = document.getElementById(`fila_${i}`);
  if (tr) tr.outerHTML = renderFila(filas[i], i);
};

// ── Helper: crear recibo de caja física ───────────────────────
async function crearReciboGoodSystem({ inscripcionId, monto, concepto }) {
  const nroRecibo = `CF-${inscripcionId}-${Date.now()}`;
  const { data, error } = await supabase.from('recibos').insert({
    nro_recibo:      nroRecibo,
    inscripcion_id:  inscripcionId,
    monto_total:     monto,
    concepto,
    tipo_pago:       'Efectivo',
    referencia:      'Pago presencial — caja física',
    usuario_caja_id: sesion.id,
    fecha_emision:   new Date().toISOString(),
  }).select('id').single();
  if (error) throw new Error('recibo: ' + error.message);
  return data.id;
}

// Marcar cuota como pagada desde el modal
window.pagarCuotaModal = async (filaIdx, cuotaId, nombre, monto, nroCuota) => {
  if (!confirm(`¿Marcar Cuota ${nroCuota} de ${nombre} como pagada?\n(origen: caja física)`)) return;
  try {
    const reciboId = await crearReciboGoodSystem({
      inscripcionId: filas[filaIdx].inscripcion_id,
      monto,
      concepto: `Cuota ${nroCuota} — pago presencial caja física`,
    });
    await supabase.from('cuotas_pagos').update({
      estado_pago: 'Pagado',
      fecha_pago:  new Date().toISOString().split('T')[0],
      recibo_id:   reciboId,
    }).eq('id', cuotaId);

    // Si es la cuota requerida, actualizar estado local de la fila
    if (nroCuota === calendarioActivo?.materias?.cuota_requerida_examen) {
      filas[filaIdx].cuotaPagada = true;
      filas[filaIdx].cuota_id    = cuotaId;
      filas[filaIdx].habAdmin    = filas[filaIdx].derechoPagado;
      actualizarObs(filaIdx);
      refreshFila(filaIdx);
      renderTabla();
    }
    toast(`Cuota ${nroCuota} marcada como pagada`, 'success');
    // Reabrir modal actualizado
    await abrirModalPagos(filaIdx);
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  }
};

// ── Guardar habilitaciones ─────────────────────────────────────
window.guardarHabilitaciones = async () => {
  if (!calendarioActivo) return;
  const btn = document.getElementById('btnGuardar');
  btn.disabled = true; btn.textContent = 'Guardando...';

  try {
    const activas = filas.filter(f => !f.excluido);

    for (const f of activas) {
      const habAdmin = f.cuotaPagada && f.derechoPagado; // recalcular con estado actual de la sesión
      const habAcad  = f.habAcad;
      // estado_materia: solo Aprobado/Reprobado si tiene ambas habilitaciones y puntaje
      let estadoMat = 'Cursando';
      if (f.excluido) {
        estadoMat = 'Ausente';
      } else if (habAdmin && habAcad && f.puntaje !== '') {
        estadoMat = Number(f.puntaje) >= 60 ? 'Aprobado' : 'Reprobado';
      } else if (!habAdmin || !habAcad) {
        estadoMat = 'Cursando';
      }

      const payload = {
        inscripcion_id:     f.inscripcion_id,
        materia_id:         calendarioActivo.materia_id,
        oportunidad_nro:    calendarioActivo.oportunidad_nro,
        estado_materia:     estadoMat,
        hab_administrativo: habAdmin,
        hab_academico:      habAcad,
        registrado_por:     sesion.id,
      };

      if (f.historial_id) {
        const { error: errUpd } = await supabase.from('historial_examenes')
          .update({
            estado_materia:     payload.estado_materia,
            hab_administrativo: payload.hab_administrativo,
            hab_academico:      payload.hab_academico,
            registrado_por:     sesion.id,
          })
          .eq('id', f.historial_id);
        if (errUpd) {
          console.error('PATCH error detalle:', JSON.stringify(errUpd));
          throw new Error(`historial id ${f.historial_id}: ${errUpd.message} | code: ${errUpd.code} | details: ${errUpd.details} | hint: ${errUpd.hint}`);
        }
      } else {
        // Para el insert, quitar fecha_registro del payload (usa DEFAULT)
        const { fecha_registro: _, ...payloadInsert } = payload;
        const { data: inserted, error: errIns } = await supabase.from('historial_examenes')
          .upsert(payloadInsert, { onConflict: 'inscripcion_id,materia_id,oportunidad_nro' })
          .select('id').single();
        if (errIns) throw new Error(`upsert: ${errIns.message}`);
        if (inserted) f.historial_id = inserted.id;
      }
    }

    toast(`${activas.length} registros guardados`, 'success');
    actualizarTopbar();
  } catch(e) {
    toast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Guardar`;
  }
};

// ── Historial ──────────────────────────────────────────────────
async function cargarHistorial() {
  const { data } = await supabase.from('historial_examenes')
    .select(`
      materia_id, oportunidad_nro,
      materias(nombre, carrera_id, carreras(nombre)),
      inscripciones_anuales(cohortes(nro_cohorte, anho_inicio))
    `)
    .order('materia_id');

  // Agrupar por materia + oportunidad
  const grupos = {};
  (data||[]).forEach(h => {
    const key = `${h.materia_id}_${h.oportunidad_nro}`;
    if (!grupos[key]) grupos[key] = {
      materia: h.materias?.nombre || '—',
      carrera: h.materias?.carreras?.nombre || '—',
      oportunidad: h.oportunidad_nro,
      registros: 0,
    };
    grupos[key].registros++;
  });

  historial = Object.values(grupos);
  renderHistorial();
}

function renderHistorial() {
  const q   = document.getElementById('searchHist').value.toLowerCase();
  const car = document.getElementById('filtroCarreraHist').value;
  let items = historial;
  if (q)   items = items.filter(h => h.materia.toLowerCase().includes(q));
  const OPORT = ['','1RA','2DA','3RA','4TA'];

  document.getElementById('histTotal').textContent = `${items.length} registros`;
  document.getElementById('histContent').innerHTML = items.length
    ? items.map(h => `
        <div class="hist-card">
          <div class="hist-card-title">${h.materia}</div>
          <div class="hist-card-meta">
            <span>${h.carrera}</span>
            <span>${OPORT[h.oportunidad] || h.oportunidad+'RA'}. Oportunidad</span>
          </div>
          <div class="hist-card-stats">
            <span class="badge badge-muted">${h.registros} registros</span>
          </div>
        </div>`).join('')
    : '<div style="text-align:center;padding:40px;color:var(--txt-muted)">Sin historial</div>';
}

['searchHist','filtroCarreraHist'].forEach(id => {
  document.getElementById(id).addEventListener('input',  renderHistorial);
  document.getElementById(id).addEventListener('change', renderHistorial);
});

document.getElementById('modalDocOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget)
    document.getElementById('modalDocOverlay').classList.remove('open');
});

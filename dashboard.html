<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Sistema UPG</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .dash-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .dash-grid-full { grid-column: 1 / -1; }

    /* KPI cards con ícono */
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    /* Actividad reciente */
    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .activity-dot.verde   { background: var(--verde); }
    .activity-dot.naranja { background: var(--naranja); }
    .activity-dot.info    { background: var(--info); }
    .activity-dot.warning { background: var(--warning); }
    .activity-text  { font-size: .85rem; color: var(--txt-secondary); flex: 1; }
    .activity-time  { font-size: .72rem; color: var(--txt-muted); white-space: nowrap; }

    /* Módulos rápidos */
    .modulos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .modulo-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
    }
    .modulo-btn:hover {
      border-color: var(--verde);
      background: var(--verde-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .modulo-btn svg { width: 24px; height: 24px; color: var(--verde); }
    .modulo-btn span { font-size: .82rem; font-weight: 600; color: var(--txt-secondary); }
    .modulo-btn:hover span { color: var(--verde); }

    /* Alertas pendientes */
    .alerta-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius);
      margin-bottom: 8px;
      font-size: .83rem;
    }
    .alerta-item:last-child { margin-bottom: 0; }
    .alerta-item.warning { background: var(--warning-bg); color: var(--warning); }
    .alerta-item.danger  { background: var(--danger-bg);  color: var(--danger);  }
    .alerta-item.info    { background: var(--info-bg);    color: var(--info);    }
    .alerta-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .alerta-item .alerta-txt { flex: 1; }
    .alerta-item a { font-weight: 600; text-decoration: underline; cursor: pointer; }

    /* Comprobantes en cola (mini lista) */
    .mini-comp {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: .82rem;
    }
    .mini-comp:last-child { border-bottom: none; }
    .mini-comp-nombre { flex: 1; color: var(--txt-secondary); font-weight: 500; }
    .mini-comp-monto  { font-family: var(--font-mono); color: var(--naranja); font-weight: 600; font-size: .85rem; }
    .mini-comp-time   { font-size: .7rem; color: var(--txt-muted); }

    /* Gráfico cuotas por mes (barras CSS) */
    .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; padding: 0 4px; }
    .bar-wrap  { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
    .bar       { width: 100%; background: var(--verde); border-radius: 4px 4px 0 0; transition: height .5s ease; min-height: 4px; }
    .bar:hover { background: var(--naranja); }
    .bar-label { font-size: .62rem; color: var(--txt-muted); white-space: nowrap; }

    .loading-kpi {
      height: 36px;
      background: linear-gradient(90deg, var(--border-light) 25%, var(--border) 50%, var(--border-light) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body>
<div class="app-layout">
  <aside id="sidebar" class="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        Dashboard
        <span id="fechaHoy"></span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost btn-sm" id="btnRefrescar" title="Actualizar datos">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Actualizar
        </button>
      </div>
    </header>

    <div class="page-content">

      <!-- KPIs principales -->
      <div class="kpi-row">
        <div class="kpi-card">
          <div class="kpi-icon verde-bg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="kpi-label">Alumnos activos</div>
          <div class="kpi-value verde" id="kpiAlumnos"><div class="loading-kpi"></div></div>
          <div class="kpi-sub" id="kpiAlumnosSub">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon naranja-bg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
          </div>
          <div class="kpi-label">Recaudado hoy</div>
          <div class="kpi-value naranja" id="kpiRecaudadoHoy"><div class="loading-kpi"></div></div>
          <div class="kpi-sub" id="kpiCompHoy">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon verde-bg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <div class="kpi-label">Recaudado este mes</div>
          <div class="kpi-value verde" id="kpiRecaudadoMes"><div class="loading-kpi"></div></div>
          <div class="kpi-sub">Comprobantes aplicados</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-icon info-bg">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          </div>
          <div class="kpi-label">Trámites pendientes</div>
          <div class="kpi-value" id="kpiTramites"><div class="loading-kpi"></div></div>
          <div class="kpi-sub">Solicitudes en secretaría</div>
        </div>
      </div>

      <!-- Grid principal -->
      <div class="dash-grid">

        <!-- Alertas -->
        <div class="card">
          <div class="card-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--naranja)" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span class="card-title">Alertas y pendientes</span>
          </div>
          <div class="card-body" id="alertasBox">
            <div class="loading-kpi" style="margin-bottom:8px"></div>
            <div class="loading-kpi" style="margin-bottom:8px"></div>
            <div class="loading-kpi"></div>
          </div>
        </div>

        <!-- Accesos rápidos -->
        <div class="card">
          <div class="card-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--verde)" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span class="card-title">Acceso rápido</span>
          </div>
          <div class="card-body">
            <div class="modulos-grid" id="modulosGrid">
              <!-- se renderiza por JS según rol -->
            </div>
          </div>
        </div>

        <!-- Cola de caja (últimos comprobantes) -->
        <div class="card">
          <div class="card-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--verde)" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
            <span class="card-title">Cola de caja</span>
            <span class="badge badge-naranja" id="badgeColaDash">0</span>
            <a href="caja.html" class="btn btn-ghost btn-sm" style="margin-left:auto">Ver todo →</a>
          </div>
          <div class="card-body" id="miniColaBox">
            <div class="loading-kpi" style="margin-bottom:8px"></div>
            <div class="loading-kpi" style="margin-bottom:8px"></div>
            <div class="loading-kpi"></div>
          </div>
        </div>

        <!-- Prospectos CRM -->
        <div class="card">
          <div class="card-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--verde)" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span class="card-title">Pipeline CRM</span>
            <a href="crm.html" class="btn btn-ghost btn-sm" style="margin-left:auto">Ver todo →</a>
          </div>
          <div class="card-body" id="crmPipelineBox">
            <div class="loading-kpi" style="margin-bottom:8px"></div>
            <div class="loading-kpi"></div>
          </div>
        </div>

        <!-- Recaudación últimas semanas -->
        <div class="card dash-grid-full">
          <div class="card-header">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--verde)" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            <span class="card-title">Recaudación — últimas 8 semanas</span>
          </div>
          <div class="card-body">
            <div class="bar-chart" id="barChart"></div>
            <div style="display:flex;justify-content:center;gap:20px;margin-top:12px;font-size:.72rem;color:var(--txt-muted)">
              <span>● Semanas anteriores</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script type="module">
import { supabase, formatGs, formatFechaHora, toast } from './assets/supabase.js';
import { requireAuth, getSesion }  from './assets/auth.js';
import { initSidebar } from './assets/sidebar.js';

const sesion = requireAuth('dashboard');
if (!sesion) throw new Error('Sin sesión');

initSidebar('dashboard');

document.getElementById('fechaHoy').textContent =
  new Date().toLocaleDateString('es-PY',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

// ── Cargar todo ───────────────────────────────────────────────
async function cargarTodo() {
  await Promise.all([
    cargarStats(),
    cargarMiniCola(),
    cargarCRM(),
    cargarBarChart(),
  ]);
}
cargarTodo();
document.getElementById('btnRefrescar').addEventListener('click', cargarTodo);

// ── Stats principales ─────────────────────────────────────────
async function cargarStats() {
  const { data, error } = await supabase.rpc('get_dashboard_stats');
  if (error || !data) {
    // fallback con queries individuales
    await cargarStatsFallback();
    return;
  }

  document.getElementById('kpiAlumnos').textContent       = data.alumnos_activos;
  document.getElementById('kpiAlumnosSub').textContent    = `+${data.alumnos_nuevos_mes} este mes`;
  document.getElementById('kpiRecaudadoHoy').textContent  = formatGs(data.recaudado_hoy);
  document.getElementById('kpiCompHoy').textContent       = `${data.comprobantes_hoy} comprobantes`;
  document.getElementById('kpiRecaudadoMes').textContent  = formatGs(data.recaudado_mes);
  document.getElementById('kpiTramites').textContent      = data.tramites_pendientes;
  document.getElementById('badgeColaDash').textContent    = data.cola_pendiente;

  renderAlertas(data);
}

async function cargarStatsFallback() {
  const [alumnos, compHoy] = await Promise.all([
    supabase.from('alumnos').select('id',{count:'exact',head:true}).eq('estado','Activo'),
    supabase.from('comprobantes_pago').select('monto_detectado,estado_procesamiento,llego_a_las')
      .gte('llego_a_las', new Date().toISOString().slice(0,10)),
  ]);

  document.getElementById('kpiAlumnos').textContent = alumnos.count ?? '—';
  const hoyItems   = compHoy.data || [];
  const recaudado  = hoyItems.filter(r=>['Aplicado','En Verificación'].includes(r.estado_procesamiento))
                             .reduce((s,r)=>s+(Number(r.monto_detectado)||0),0);
  document.getElementById('kpiRecaudadoHoy').textContent = formatGs(recaudado);
  document.getElementById('kpiCompHoy').textContent      = `${hoyItems.length} comprobantes`;

  const cola = hoyItems.filter(r=>!['Aplicado','Procesando','Rechazado','En Verificación'].includes(r.estado_procesamiento)).length;
  document.getElementById('badgeColaDash').textContent = cola;

  document.getElementById('kpiRecaudadoMes').textContent = '—';
  document.getElementById('kpiTramites').textContent     = '—';

  renderAlertas({ cola_pendiente: cola, tramites_pendientes: 0, prospectos_nuevos: 0 });
}

function renderAlertas(data) {
  const alertas = [];

  if (data.cola_pendiente > 0) {
    alertas.push({
      tipo: 'warning',
      icon: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>`,
      txt:  `<strong>${data.cola_pendiente} comprobante${data.cola_pendiente>1?'s':''}</strong> en cola esperando procesamiento.`,
      link: 'caja.html',
      linkTxt: 'Ir a Caja'
    });
  }
  if (data.tramites_pendientes > 0) {
    alertas.push({
      tipo: 'info',
      icon: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
      txt:  `<strong>${data.tramites_pendientes} trámite${data.tramites_pendientes>1?'s':''}</strong> pendiente${data.tramites_pendientes>1?'s':''} en Secretaría.`,
      link: 'secretaria.html',
      linkTxt: 'Ver trámites'
    });
  }
  if (data.prospectos_nuevos > 0) {
    alertas.push({
      tipo: 'info',
      icon: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>`,
      txt:  `<strong>${data.prospectos_nuevos} prospecto${data.prospectos_nuevos>1?'s':''} nuevo${data.prospectos_nuevos>1?'s':''}</strong> sin contactar.`,
      link: 'crm.html',
      linkTxt: 'Ver CRM'
    });
  }

  const box = document.getElementById('alertasBox');
  if (!alertas.length) {
    box.innerHTML = `<div style="text-align:center;padding:24px;color:var(--txt-muted)">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.3;display:block;margin:0 auto 8px"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      <p style="font-size:.83rem">Todo al día. Sin alertas pendientes.</p>
    </div>`;
    return;
  }

  box.innerHTML = alertas.map(a => `
    <div class="alerta-item ${a.tipo}">
      ${a.icon}
      <span class="alerta-txt">${a.txt} <a href="${a.link}">${a.linkTxt} →</a></span>
    </div>`).join('');
}

// ── Accesos rápidos según rol ─────────────────────────────────
const MODULOS = {
  Admin:     ['crm','admision','caja','academico','secretaria','configuracion'],
  Academico: ['crm','admision','academico','secretaria'],
  Cajero:    ['caja'],
  Docente:   ['academico'],
};
const MODULO_INFO = {
  crm:          { label:'CRM', href:'crm.html', icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>` },
  admision:     { label:'Admisión', href:'admision.html', icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>` },
  caja:         { label:'Caja', href:'caja.html', icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>` },
  academico:    { label:'Académico', href:'academico.html', icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>` },
  secretaria:   { label:'Secretaría', href:'secretaria.html', icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>` },
  configuracion:{ label:'Configuración', href:'configuracion.html', icon:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>` },
};

const modulosRol = MODULOS[sesion.rol] || [];
document.getElementById('modulosGrid').innerHTML = modulosRol.map(m => {
  const info = MODULO_INFO[m];
  return `<a href="${info.href}" class="modulo-btn">${info.icon}<span>${info.label}</span></a>`;
}).join('');

// ── Mini cola ─────────────────────────────────────────────────
async function cargarMiniCola() {
  const { data } = await supabase
    .from('comprobantes_pago')
    .select('id, monto_detectado, ci_remitente, banco_origen, llego_a_las, inscripciones_anuales(alumnos(nombres,apellidos))')
    .not('estado_procesamiento','in','("Aplicado","Procesando","Rechazado","En Verificación")')
    .order('id',{ascending:false})
    .limit(5);

  const box = document.getElementById('miniColaBox');
  if (!data?.length) {
    box.innerHTML = `<p style="text-align:center;color:var(--txt-muted);font-size:.83rem;padding:16px 0">Sin comprobantes pendientes</p>`;
    return;
  }

  box.innerHTML = data.map(r => {
    const al    = r.inscripciones_anuales?.alumnos;
    const nombre = al ? `${al.nombres} ${al.apellidos}` : (r.ci_remitente || 'Sin identificar');
    const hace  = tiempoRelativo(r.llego_a_las);
    return `<div class="mini-comp">
      <div class="activity-dot naranja"></div>
      <span class="mini-comp-nombre">${nombre}</span>
      <span class="mini-comp-time">${hace}</span>
      <span class="mini-comp-monto">${formatGs(r.monto_detectado)}</span>
    </div>`;
  }).join('');
}

// ── Pipeline CRM ──────────────────────────────────────────────
async function cargarCRM() {
  const { data } = await supabase
    .from('prospectos')
    .select('etapa_crm')
    .not('etapa_crm','in','("Convertido","Perdido","Rechazado")');

  const box = document.getElementById('crmPipelineBox');
  if (!data?.length) {
    box.innerHTML = `<p style="text-align:center;color:var(--txt-muted);font-size:.83rem;padding:16px 0">Sin prospectos activos</p>`;
    return;
  }

  const etapas = ['Nuevo','Contactado','Formulario enviado','Documentos recibidos','Documentos verificados','Aprobado'];
  const conteo = {};
  data.forEach(r => { conteo[r.etapa_crm] = (conteo[r.etapa_crm]||0) + 1; });

  box.innerHTML = etapas.map(e => {
    const n = conteo[e] || 0;
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:.82rem">
      <div style="width:130px;color:var(--txt-muted);flex-shrink:0">${e}</div>
      <div style="flex:1;background:var(--border-light);border-radius:999px;height:6px;overflow:hidden">
        <div style="width:${Math.min(n*10,100)}%;height:100%;background:var(--verde);border-radius:999px;transition:width .5s ease"></div>
      </div>
      <span style="font-weight:600;color:var(--txt-primary);width:20px;text-align:right">${n}</span>
    </div>`;
  }).join('');
}

// ── Gráfico barras recaudación ────────────────────────────────
async function cargarBarChart() {
  const desde = new Date();
  desde.setDate(desde.getDate() - 55);

  const { data } = await supabase
    .from('comprobantes_pago')
    .select('monto_detectado, llego_a_las')
    .in('estado_procesamiento',['Aplicado','En Verificación'])
    .gte('llego_a_las', desde.toISOString());

  // Agrupar por semana
  const semanas = {};
  (data||[]).forEach(r => {
    const d   = new Date(r.llego_a_las);
    const dia = d.getDay();
    const ini = new Date(d); ini.setDate(d.getDate() - dia);
    const key = ini.toISOString().slice(0,10);
    semanas[key] = (semanas[key]||0) + (Number(r.monto_detectado)||0);
  });

  const keys   = Object.keys(semanas).sort().slice(-8);
  const vals   = keys.map(k => semanas[k]);
  const maxVal = Math.max(...vals, 1);

  const chart = document.getElementById('barChart');
  chart.innerHTML = keys.map((k, i) => {
    const pct   = Math.round((vals[i]/maxVal)*100);
    const label = new Date(k).toLocaleDateString('es-PY',{day:'2-digit',month:'2-digit'});
    return `<div class="bar-wrap" title="${formatGs(vals[i])}">
      <div class="bar" style="height:${pct}%"></div>
      <div class="bar-label">${label}</div>
    </div>`;
  }).join('');
}

// ── Tiempo relativo ───────────────────────────────────────────
function tiempoRelativo(iso) {
  if (!iso) return '—';
  const diff = Date.now() - new Date(iso).getTime();
  const min  = Math.floor(diff/60000);
  if (min < 1)  return 'ahora';
  if (min < 60) return `hace ${min}m`;
  const h = Math.floor(min/60);
  if (h < 24)   return `hace ${h}h`;
  return `hace ${Math.floor(h/24)}d`;
}

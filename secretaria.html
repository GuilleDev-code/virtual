<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secretaría — Sistema UPG</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="icon" type="image/png" href="assets/logo.png">
  <style>
    /* ── Tabs de secretaría ─────────────────────────────────── */
    .sec-tabs {
      display: flex;
      gap: 0;
      padding: 0 24px;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      flex-shrink: 0;
      overflow-x: auto;
    }

    .sec-tab {
      padding: 12px 18px;
      font-size: .86rem;
      font-weight: 500;
      color: var(--txt-secondary);
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all var(--transition);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .sec-tab:hover {
      color: var(--verde);
    }

    .sec-tab.active {
      color: var(--verde);
      border-bottom-color: var(--verde);
      font-weight: 600;
    }

    .sec-tab .tc {
      background: var(--naranja);
      color: #fff;
      font-size: .62rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
    }

    .sec-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--topbar-h));
      overflow: hidden;
    }

    .sec-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    /* ── Tabla de solicitudes ───────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: var(--txt-muted);
      pointer-events: none;
    }

    .search-wrap input {
      padding-left: 32px;
      width: 240px;
    }

    /* ── Detalle lateral (drawer) ───────────────────────────── */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .3);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }

    .drawer-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 670px;
      height: 100vh;
      background: var(--surface);
      z-index: 160;
      box-shadow: -8px 0 30px rgba(0, 0, 0, .15);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .25s ease;
    }

    .drawer-overlay.open .drawer {
      transform: translateX(0);
    }

    .drawer-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .drawer-title {
      font-size: 1rem;
      font-weight: 700;
      flex: 1;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .drawer-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    /* Timeline de seguimiento */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .tl-item {
      display: flex;
      gap: 14px;
      position: relative;
      padding-bottom: 16px;
    }

    .tl-item:last-child {
      padding-bottom: 0;
    }

    .tl-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      width: 28px;
    }

    .tl-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .7rem;
      font-weight: 700;
      flex-shrink: 0;
      z-index: 1;
    }

    .tl-dot.verde {
      background: var(--verde-light);
      color: var(--verde);
    }

    .tl-dot.naranja {
      background: var(--naranja-light);
      color: var(--naranja);
    }

    .tl-dot.muted {
      background: var(--border);
      color: var(--txt-muted);
    }

    .tl-line {
      flex: 1;
      width: 2px;
      background: var(--border-light);
      margin-top: 4px;
    }

    .tl-item:last-child .tl-line {
      display: none;
    }

    .tl-content {
      flex: 1;
      padding-top: 4px;
    }

    .tl-estado {
      font-size: .82rem;
      font-weight: 600;
      color: var(--txt-primary);
    }

    .tl-fecha {
      font-size: .72rem;
      color: var(--txt-muted);
    }

    .tl-obs {
      font-size: .78rem;
      color: var(--txt-secondary);
      margin-top: 3px;
    }

    /* Info box alumno */
    .alumno-info-box {
      background: var(--verde-light);
      border: 1px solid rgba(26, 107, 60, .15);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .alumno-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--verde);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: .9rem;
      flex-shrink: 0;
    }

    .alumno-data-label {
      font-size: .68rem;
      color: var(--txt-muted);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .alumno-data-val {
      font-size: .85rem;
      font-weight: 600;
      color: var(--txt-primary);
    }

    /* Convalidaciones detalle */
    .conv-materia-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
      font-size: .83rem;
    }

    .conv-materia-row:last-child {
      border-bottom: none;
    }

    /* Modal nueva solicitud */
    #modalNuevaTipo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .tipo-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 10px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
      background: var(--surface);
    }

    .tipo-btn:hover {
      border-color: var(--verde);
      background: var(--verde-light);
    }

    .tipo-btn svg {
      width: 22px;
      height: 22px;
      color: var(--verde);
    }

    .tipo-btn span {
      font-size: .78rem;
      font-weight: 600;
      color: var(--txt-secondary);
    }

    .tipo-btn:hover span {
      color: var(--verde);
    }

    /* Botón generar nota Word */
    .btn-word {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1B5E20;
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 7px 14px;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background var(--transition);
      text-decoration: none;
    }

    .btn-word:hover {
      background: #2E7D32;
    }

    .btn-word svg {
      flex-shrink: 0;
    }

    .dropdown-resultados {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1000;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .opcion-inscripcion {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .opcion-inscripcion:hover {
      background-color: #f5f5f5;
    }
  </style>
</head>

<body>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-title">Secretaría <span id="fechaHoy"></span></div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" id="btnNuevaSolicitud">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Nueva solicitud
          </button>
        </div>
      </header>

      <div class="sec-wrap">
        <!-- Tabs -->
        <div class="sec-tabs">
          <button class="sec-tab active" data-tab="todas">Todas <span class="tc" id="tcTodas">0</span></button>
          <button class="sec-tab" data-tab="titulo">Título <span class="tc" id="tcTitulo">0</span></button>
          <button class="sec-tab" data-tab="certificado">Certificado</button>
          <button class="sec-tab" data-tab="constancia">Constancia</button>
          <button class="sec-tab" data-tab="convalidacion">Convalidación</button>
          <button class="sec-tab" data-tab="baja">Baja</button>
          <button class="sec-tab" data-tab="traslado">Traslado</button>
          <button class="sec-tab" data-tab="legajos">Legajos docentes</button>
        </div>

        <div class="sec-content">
          <!-- Toolbar -->
          <div class="toolbar">
            <div class="search-wrap">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.35-4.35" />
              </svg>
              <input type="text" class="form-control" id="searchSec" placeholder="Buscar por alumno, CI...">
            </div>
            <select class="form-control" id="filtroEstado" style="width:auto">
              <option value="">Todos los estados</option>
              <option value="Pendiente">Pendiente</option>
              <option value="En proceso">En proceso</option>
              <option value="Completado">Completado</option>
              <option value="Rechazado">Rechazado</option>
            </select>
            <button class="btn btn-ghost btn-sm" id="btnRefrescar">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10" />
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
              </svg>
              Actualizar
            </button>
            <span id="totalLabel" style="font-size:.78rem;color:var(--txt-muted);margin-left:auto"></span>
          </div>

          <!-- Barra de selección múltiple para nota conjunta -->
          <div id="barraSeleccion" style="display:none;align-items:center;gap:12px;background:var(--verde-light,#eaf3ec);border:1px solid var(--verde);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px">
            <span id="barraSeleccionTexto" style="font-size:.83rem;color:var(--txt-primary);font-weight:600;flex:1"></span>
            <button class="btn btn-ghost btn-sm" id="btnLimpiarSeleccion">Cancelar</button>
            <button class="btn-word" id="btnGenerarGrupal" disabled>
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              Generar nota conjunta
            </button>
          </div>

          <!-- Tabla solicitudes -->
          <div class="table-wrapper" id="tablaWrap">
            <table>
              <thead>
                <tr>
                  <th style="width:32px"><input type="checkbox" id="chkTodas" title="Seleccionar todas las agrupables"></th>
                  <th>#</th>
                  <th>Alumno</th>
                  <th>CI</th>
                  <th>Tipo</th>
                  <th>Fecha solicitud</th>
                  <th>Estado</th>
                  <th>Gestionado por</th>
                  <th>Últ. actualización</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="tbodySolicitudes">
                <tr>
                  <td colspan="10" class="text-center" style="padding:40px;color:var(--txt-muted)">Cargando...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Tabla legajos docentes (oculta por defecto) -->
          <div id="tablaLegajosWrap" style="display:none">
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>CI</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Fecha recepción</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="tbodyLegajos">
                  <tr>
                    <td colspan="8" class="text-center" style="padding:40px;color:var(--txt-muted)">Cargando...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Drawer detalle solicitud ─────────────────────────────── -->
  <div class="drawer-overlay" id="drawerOverlay">
    <div class="drawer" id="drawer">
      <div class="drawer-header">
        <div>
          <div class="drawer-title" id="drawerTitle">Solicitud</div>
          <div style="font-size:.75rem;color:var(--txt-muted)" id="drawerSubtitle"></div>
        </div>
        <span class="badge" id="drawerBadge">—</span>
        <button class="modal-close" id="btnCerrarDrawer">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerBody">
        <!-- contenido dinámico -->
      </div>
      <div class="drawer-footer" id="drawerFooter">
        <!-- acciones dinámicas -->
      </div>
    </div>
  </div>

  <!-- ── Modal nueva solicitud ───────────────────────────────── -->
  <div class="modal-overlay" id="modalNuevaSolicitudOverlay">
    <div class="modal" id="modalNueva">
      <div class="modal-header">
        <span class="modal-title" id="modalNuevaTitle">Nueva solicitud</span>
        <button class="modal-close" onclick="cerrarModalNueva()">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalNuevaBody">
        <!-- paso 1: elegir tipo -->
        <div id="paso1">
          <p style="font-size:.85rem;color:var(--txt-muted);margin-bottom:14px">Seleccioná el tipo de trámite</p>
          <div id="modalNuevaTipo">
            <button class="tipo-btn" onclick="elegirTipo('titulo')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
                <path d="M6 12v5c3 3 9 3 12 0v-5" />
              </svg>
              <span>Título</span>
            </button>
            <button class="tipo-btn" onclick="elegirTipo('certificado')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="12" y1="18" x2="12" y2="12" />
                <line x1="9" y1="15" x2="15" y2="15" />
              </svg>
              <span>Certificado de estudio</span>
            </button>
            <button class="tipo-btn" onclick="elegirTipo('constancia')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
              </svg>
              <span>Constancia de estudio</span>
            </button>
            <button class="tipo-btn" onclick="elegirTipo('convalidacion')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <polyline points="9 11 12 14 22 4" />
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
              </svg>
              <span>Convalidación</span>
            </button>
            <button class="tipo-btn" onclick="elegirTipo('baja')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              <span>Baja</span>
            </button>
            <button class="tipo-btn" onclick="elegirTipo('traslado')">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <polyline points="15 10 20 15 15 20" />
                <path d="M4 4v7a4 4 0 0 0 4 4h12" />
              </svg>
              <span>Traslado</span>
            </button>
          </div>
        </div>
        <!-- paso 2: formulario según tipo -->
        <div id="paso2" style="display:none">
          <button onclick="volverPaso1()"
            style="font-size:.78rem;color:var(--verde);margin-bottom:14px;display:flex;align-items:center;gap:4px">
            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6" />
            </svg>
            Volver
          </button>
          <div id="formNueva"></div>
        </div>
      </div>
      <div class="modal-footer" id="modalNuevaFooter" style="display:none">
        <button class="btn btn-ghost" onclick="cerrarModalNueva()">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardarSolicitud">Guardar solicitud</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { supabase, formatGs, formatFechaHora, toast } from './assets/supabase.js';
    import { requireAuth } from './assets/auth.js';
    import { initSidebar } from './assets/sidebar.js';

    const docx = window.docx || window.Docx || window.DOCX;

    if (!docx) {
      console.error("La librería docx no se cargó correctamente.");
    }

    const Packer = docx.Packer;
    const saveAs = window.saveAs;
    const {
      Document,
      Header,
      Footer,
      Paragraph,
      TextRun,
      ImageRun,
      AlignmentType,
      PageNumber
    } = docx;

    const sesion = requireAuth('secretaria');
    if (!sesion) throw new Error('Sin sesión');
    initSidebar('secretaria');

    document.getElementById('fechaHoy').textContent =
      new Date().toLocaleDateString('es-PY', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

    // ── Estado ────────────────────────────────────────────────────
    let tabActual = 'todas';
    let solicitudes = [];
    let legajos = [];
    let alumnos = [];
    let materias = [];
    let tipoNuevo = null;
    let solicActiva = null;

    // Tipos de nota que soportan agrupar varios alumnos en un mismo Word
    const TIPOS_AGRUPABLES = ['certificado', 'titulo', 'baja', 'convalidacion'];
    let seleccionadas = new Set();

    // ── Init ──────────────────────────────────────────────────────
    await Promise.all([cargarSolicitudes(), cargarAlumnos(), cargarMaterias()]);

    // ── Tabs ──────────────────────────────────────────────────────
    document.querySelectorAll('.sec-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sec-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tabActual = btn.dataset.tab;
        seleccionadas.clear();
        actualizarBarraSeleccion();

        const esLegajos = tabActual === 'legajos';
        document.getElementById('tablaWrap').style.display = esLegajos ? 'none' : 'block';
        document.getElementById('tablaLegajosWrap').style.display = esLegajos ? 'block' : 'none';

        if (esLegajos) cargarLegajos();
        else renderSolicitudes();
      });
    });

    // ── Búsqueda y filtro ─────────────────────────────────────────
    document.getElementById('searchSec').addEventListener('input', () => { seleccionadas.clear(); actualizarBarraSeleccion(); renderSolicitudes(); });
    document.getElementById('filtroEstado').addEventListener('change', () => { seleccionadas.clear(); actualizarBarraSeleccion(); renderSolicitudes(); });
    document.getElementById('btnRefrescar').addEventListener('click', () => {
      tabActual === 'legajos' ? cargarLegajos() : cargarSolicitudes();
    });

    // ── Cargar solicitudes ────────────────────────────────────────
    async function cargarSolicitudes() {
      const { data } = await supabase
        .from('solicitudes_secretaria')
        .select(`
          *,
          inscripciones_anuales(
            alumnos(nombres, apellidos, ci, telefono),
            cohortes(id, nro_cohorte, anho_inicio, carreras(id, nombre))
          ),
          usuarios_sistema:gestionado_por(nombre)
        `)
        .order('created_at', { ascending: false });

      solicitudes = data || [];
      seleccionadas.clear();
      actualizarBarraSeleccion();


      // Conteos por tab
      const tipos = ['titulo', 'certificado', 'constancia', 'convalidacion', 'baja', 'traslado'];
      document.getElementById('tcTodas').textContent = solicitudes.filter(s => ['Pendiente', 'En proceso'].includes(s.estado)).length;
      document.getElementById('tcTitulo').textContent = solicitudes.filter(s => s.tipo === 'titulo' && ['Pendiente', 'En proceso'].includes(s.estado)).length;

      renderSolicitudes();
    }

    function renderSolicitudes() {
      const q = document.getElementById('searchSec').value.toLowerCase();
      const filtEst = document.getElementById('filtroEstado').value;

      let items = solicitudes;
      if (tabActual !== 'todas' && tabActual !== 'legajos') items = items.filter(s => s.tipo === tabActual);
      if (filtEst) items = items.filter(s => s.estado === filtEst);
      if (q) items = items.filter(s => {
        const al = s.inscripciones_anuales?.alumnos;
        return (al?.nombres + ' ' + al?.apellidos + ' ' + al?.ci).toLowerCase().includes(q);
      });

      document.getElementById('totalLabel').textContent = `${items.length} registro${items.length !== 1 ? 's' : ''}`;

      const TIPO_LABEL = { titulo: 'Título', certificado: 'Certificado', constancia: 'Constancia', convalidacion: 'Convalidación', baja: 'Baja', traslado: 'Traslado' };
      const EST_CLASS = { Pendiente: 'badge-warning', 'En proceso': 'badge-info', Completado: 'badge-success', Rechazado: 'badge-danger', Cancelado: 'badge-muted' };

      const tbody = document.getElementById('tbodySolicitudes');
      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="text-center" style="padding:40px;color:var(--txt-muted)">Sin solicitudes</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map((s, i) => {
        const al = s.inscripciones_anuales?.alumnos;
        const est = s.estado || 'Pendiente';
        const agrupable = TIPOS_AGRUPABLES.includes(s.tipo);
        const chk = agrupable
          ? `<input type="checkbox" class="chkFila" data-id="${s.id}" ${seleccionadas.has(s.id) ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleSeleccion(${s.id}, this.checked)">`
          : `<input type="checkbox" disabled title="Este tipo no admite nota conjunta">`;
        return `<tr style="cursor:pointer" onclick="abrirDrawer(${s.id})">
      <td onclick="event.stopPropagation()">${chk}</td>
      <td class="td-mono">${i + 1}</td>
      <td class="td-bold">${al ? al.nombres + ' ' + al.apellidos : '—'}</td>
      <td class="td-mono">${al?.ci || '—'}</td>
      <td><span class="badge badge-muted">${TIPO_LABEL[s.tipo] || s.tipo}</span></td>
      <td class="td-mono" style="font-size:.78rem">${formatFechaHora(s.created_at)}</td>
      <td><span class="badge ${EST_CLASS[est] || 'badge-muted'}">${est}</span></td>
      <td>${s.usuarios_sistema?.nombre || '—'}</td>
      <td class="td-mono" style="font-size:.78rem">${s.fecha_resolucion ? formatFechaHora(s.fecha_resolucion) : '—'}</td>
      <td>
        <button class="btn btn-icon" onclick="event.stopPropagation();abrirDrawer(${s.id})" title="Ver detalle">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </td>
    </tr>`;
      }).join('');
    }

    // ── Selección múltiple para nota conjunta ───────────────────────
    function claveGrupo(s) {
      const cohorte = s.inscripciones_anuales?.cohortes;
      return `${s.tipo}|${cohorte?.id ?? 'sc'}`;
    }

    window.toggleSeleccion = (id, checked) => {
      if (checked) {
        const s = solicitudes.find(x => x.id === id);
        // Si ya hay otras seleccionadas, validar que compartan tipo + cohorte
        if (seleccionadas.size > 0) {
          const idRef = [...seleccionadas][0];
          const sRef = solicitudes.find(x => x.id === idRef);
          if (sRef && claveGrupo(sRef) !== claveGrupo(s)) {
            toast('Solo se pueden agrupar solicitudes del mismo tipo, programa y cohorte', 'warning');
            renderSolicitudes(); // repinta y destilda el checkbox inválido
            return;
          }
        }
        seleccionadas.add(id);
      } else {
        seleccionadas.delete(id);
      }
      actualizarBarraSeleccion();
    };

    document.getElementById('chkTodas').addEventListener('change', (e) => {
      const marcarTodo = e.target.checked;
      seleccionadas.clear();
      if (marcarTodo) {
        // Selecciona solo el primer grupo (tipo+cohorte) agrupable visible, para no mezclar
        const q = document.getElementById('searchSec').value.toLowerCase();
        const filtEst = document.getElementById('filtroEstado').value;
        let items = solicitudes.filter(s => TIPOS_AGRUPABLES.includes(s.tipo));
        if (tabActual !== 'todas' && tabActual !== 'legajos') items = items.filter(s => s.tipo === tabActual);
        if (filtEst) items = items.filter(s => s.estado === filtEst);
        if (q) items = items.filter(s => {
          const al = s.inscripciones_anuales?.alumnos;
          return (al?.nombres + ' ' + al?.apellidos + ' ' + al?.ci).toLowerCase().includes(q);
        });
        if (items.length) {
          const primeraClave = claveGrupo(items[0]);
          items.filter(s => claveGrupo(s) === primeraClave).forEach(s => seleccionadas.add(s.id));
        }
      }
      renderSolicitudes();
      actualizarBarraSeleccion();
    });

    document.getElementById('btnLimpiarSeleccion').addEventListener('click', () => {
      seleccionadas.clear();
      document.getElementById('chkTodas').checked = false;
      renderSolicitudes();
      actualizarBarraSeleccion();
    });

    function actualizarBarraSeleccion() {
      const barra = document.getElementById('barraSeleccion');
      const btn = document.getElementById('btnGenerarGrupal');
      const n = seleccionadas.size;

      if (n < 2) {
        barra.style.display = 'none';
        return;
      }

      const items = [...seleccionadas].map(id => solicitudes.find(s => s.id === id)).filter(Boolean);
      const s0 = items[0];
      const cohorte = s0?.inscripciones_anuales?.cohortes;
      const carrera = cohorte?.carreras?.nombre || '—';
      const TIPO_LABEL = { titulo: 'Título', certificado: 'Certificado', convalidacion: 'Convalidación', baja: 'Baja' };

      barra.style.display = 'flex';
      document.getElementById('barraSeleccionTexto').textContent =
        `${n} solicitudes seleccionadas — ${TIPO_LABEL[s0?.tipo] || s0?.tipo} · ${carrera} · ${cohorte?.nro_cohorte || ''}ra. Cohorte ${cohorte?.anho_inicio || ''}`;
      btn.disabled = false;
    }

    document.getElementById('btnGenerarGrupal').addEventListener('click', () => {
      generarNotaGrupal([...seleccionadas]);
    });

    // ── Legajos docentes ──────────────────────────────────────────
    async function cargarLegajos() {
      const { data } = await supabase
        .from('legajos_docentes')
        .select('*, usuarios_sistema:gestionado_por(nombre)')
        .order('created_at', { ascending: false });

      legajos = data || [];
      const EST_CLASS = { Recibido: 'badge-info', 'En revisión': 'badge-warning', 'Nota enviada': 'badge-naranja', 'Alta aprobada': 'badge-success', Rechazado: 'badge-danger' };
      const tbody = document.getElementById('tbodyLegajos');

      if (!legajos.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center" style="padding:40px;color:var(--txt-muted)">Sin legajos registrados</td></tr>`;
        return;
      }
      tbody.innerHTML = legajos.map((l, i) => `<tr>
    <td class="td-mono">${i + 1}</td>
    <td class="td-bold">${l.nombres} ${l.apellidos}</td>
    <td class="td-mono">${l.ci}</td>
    <td>${l.email || '—'}</td>
    <td>${l.telefono || '—'}</td>
    <td><span class="badge ${EST_CLASS[l.estado] || 'badge-muted'}">${l.estado}</span></td>
    <td class="td-mono" style="font-size:.78rem">${formatFechaHora(l.fecha_recepcion)}</td>
    <td>
      <button class="btn btn-icon" onclick="abrirDrawerLegajo(${l.id})" title="Ver detalle">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </td>
  </tr>`).join('');
    }

    // ── Drawer solicitud ──────────────────────────────────────────
    window.abrirDrawer = async (id) => {
      const { data: s } = await supabase
        .from('solicitudes_secretaria')
        .select('*, inscripciones_anuales(alumnos(nombres,apellidos,ci,telefono,email)), usuarios_sistema:gestionado_por(nombre)')
        .eq('id', id).single();

      if (!s) return;
      solicActiva = s;

      const TIPO_LABEL = { titulo: 'Solicitud de Título', certificado: 'Certificado de Estudio', constancia: 'Constancia de Estudio', convalidacion: 'Convalidación', baja: 'Solicitud de Baja', traslado: 'Traslado de Filial' };
      const EST_CLASS = { Pendiente: 'badge-warning', 'En proceso': 'badge-info', Completado: 'badge-success', Rechazado: 'badge-danger', Cancelado: 'badge-muted' };
      const al = s.alumnos;

      document.getElementById('drawerTitle').textContent = TIPO_LABEL[s.tipo] || s.tipo;
      document.getElementById('drawerSubtitle').textContent = `Solicitud #${s.id} • ${formatFechaHora(s.created_at)}`;
      const bdg = document.getElementById('drawerBadge');
      bdg.className = 'badge ' + (EST_CLASS[s.estado] || 'badge-muted');
      bdg.textContent = s.estado;

      // Cuerpo del drawer
      let html = '';

      // Info alumno
      if (al) {
        html += `<div class="alumno-info-box">
      <div class="alumno-avatar">${al.nombres.charAt(0)}${al.apellidos.charAt(0)}</div>
      <div style="flex:1">
        <div class="alumno-data-val">${al.nombres} ${al.apellidos}</div>
        <div style="display:flex;gap:16px;margin-top:4px">
          <div><div class="alumno-data-label">CI</div><div class="alumno-data-val" style="font-size:.8rem">${al.ci}</div></div>
          <div><div class="alumno-data-label">Teléfono</div><div class="alumno-data-val" style="font-size:.8rem">${al.telefono || '—'}</div></div>
          <div><div class="alumno-data-label">Email</div><div class="alumno-data-val" style="font-size:.8rem">${al.email || '—'}</div></div>
        </div>
      </div>
    </div>`;
      }

      // Info adicional según tipo
      if (s.tipo === 'traslado' && s.filial_destino) {
        html += `<div class="form-group"><div class="proc-section-label" style="font-size:.72rem;font-weight:700;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.07em">Filial destino</div>
      <div style="font-size:.88rem;font-weight:600;color:var(--txt-primary)">${s.filial_destino}</div></div>`;
      }

      if (s.observaciones) {
        html += `<div><div style="font-size:.72rem;font-weight:700;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">Observaciones</div>
      <div style="font-size:.83rem;color:var(--txt-secondary);background:var(--surface-2);border-radius:var(--radius);padding:10px 12px">${s.observaciones}</div></div>`;
      }

      // Convalidaciones: mostrar materias
      if (s.tipo === 'convalidacion') {
        const { data: convs } = await supabase
          .from('convalidaciones_detalle')
          .select('*, materias(nombre)')
          .eq('solicitud_id', id);

        if (convs?.length) {
          html += `<div>
        <div style="font-size:.72rem;font-weight:700;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Materias solicitadas</div>`;
          html += convs.map(c => {
            const estC = { Pendiente: 'badge-warning', Aprobada: 'badge-success', Rechazada: 'badge-danger' }[c.estado] || 'badge-muted';
            return `<div class="conv-materia-row">
          <div style="flex:1">
            <div style="font-weight:600;font-size:.83rem">${c.materias?.nombre || '—'}</div>
            <div style="font-size:.72rem;color:var(--txt-muted)">${c.institucion_origen} — ${c.materia_origen_nombre}</div>
          </div>
          <span class="badge ${estC}" style="font-size:.65rem">${c.estado}</span>
          ${c.estado === 'Pendiente' ? `<button class="btn btn-ghost btn-sm" onclick="resolverConv(${c.id},'Aprobada')">Aprobar</button><button class="btn btn-ghost btn-sm" onclick="resolverConv(${c.id},'Rechazada')">Rechazar</button>` : ''}
        </div>`;
          }).join('');
          html += '</div>';
        }
      }

      // Seguimiento título
      if (s.tipo === 'titulo') {
        const { data: seg } = await supabase
          .from('seguimiento_titulo')
          .select('*')
          .eq('solicitud_id', id)
          .order('fecha_cambio', { ascending: true });

        html += `<div>
      <div style="font-size:.72rem;font-weight:700;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">Seguimiento</div>
      <div class="timeline">`;
        if (seg?.length) {
          html += seg.map(t => `
        <div class="tl-item">
          <div class="tl-left"><div class="tl-dot verde">✓</div><div class="tl-line"></div></div>
          <div class="tl-content">
            <div class="tl-estado">${t.estado_nuevo}</div>
            <div class="tl-fecha">${formatFechaHora(t.fecha_cambio)}</div>
            ${t.observacion ? `<div class="tl-obs">${t.observacion}</div>` : ''}
          </div>
        </div>`).join('');
        } else {
          html += `<div style="color:var(--txt-muted);font-size:.82rem">Sin actualizaciones de estado aún.</div>`;
        }
        html += `</div></div>
    <!-- Agregar nuevo estado -->
    <div>
      <div style="font-size:.72rem;font-weight:700;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Agregar actualización</div>
      <div style="display:flex;gap:8px">
        <input type="text" class="form-control" id="nuevoEstadoSeg" placeholder="Ej: En imprenta, Listo para entrega...">
        <button class="btn btn-primary btn-sm" onclick="agregarSeguimiento(${s.id})">Agregar</button>
      </div>
      <input type="text" class="form-control" id="obsNuevoEstado" placeholder="Observación (opcional)" style="margin-top:8px">
    </div>`;
      }

      document.getElementById('drawerBody').innerHTML = html;

      // Footer con acciones
      let footer = '';
      if (s.estado === 'Pendiente') {
        footer += `<button class="btn btn-outline btn-sm" onclick="cambiarEstado(${s.id},'En proceso')">Marcar en proceso</button>`;
      }
      if (['Pendiente', 'En proceso'].includes(s.estado)) {
        footer += `<button class="btn btn-primary btn-sm" onclick="cambiarEstado(${s.id},'Completado')">Marcar completado</button>`;
        footer += `<button class="btn btn-ghost btn-sm" onclick="cambiarEstado(${s.id},'Rechazado')">Rechazar</button>`;
      }
      if (s.estado !== 'Completado') {
        footer += `<button class="btn btn-ghost btn-sm" id="btnEnviarWA" onclick="enviarWhatsApp(${s.id})">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9l20-7z"/></svg>
      Notificar alumno
    </button>`;
      }

      // Botón generar nota Word (siempre disponible para tipos con nota)
      const TIPOS_CON_NOTA = ['titulo', 'certificado', 'constancia', 'baja', 'traslado', 'convalidacion'];
      if (TIPOS_CON_NOTA.includes(s.tipo)) {
        footer += `<button class="btn-word" onclick="generarNota(${s.id})">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Generar nota Word
    </button>`
      }

      document.getElementById('drawerFooter').innerHTML = footer;
      document.getElementById('drawerOverlay').classList.add('open');
    };

    window.abrirDrawerLegajo = async (id) => {
      const l = legajos.find(x => x.id === id);
      if (!l) return;

      const EST_CLASS = { Recibido: 'badge-info', 'En revisión': 'badge-warning', 'Nota enviada': 'badge-naranja', 'Alta aprobada': 'badge-success', Rechazado: 'badge-danger' };
      document.getElementById('drawerTitle').textContent = `${l.nombres} ${l.apellidos}`;
      document.getElementById('drawerSubtitle').textContent = `Legajo docente • CI: ${l.ci}`;
      const bdg = document.getElementById('drawerBadge');
      bdg.className = 'badge ' + (EST_CLASS[l.estado] || 'badge-muted');
      bdg.textContent = l.estado;

      document.getElementById('drawerBody').innerHTML = `
    <div class="alumno-info-box">
      <div class="alumno-avatar">${l.nombres.charAt(0)}${l.apellidos.charAt(0)}</div>
      <div>
        <div class="alumno-data-val">${l.nombres} ${l.apellidos}</div>
        <div style="display:flex;gap:16px;margin-top:4px">
          <div><div class="alumno-data-label">CI</div><div class="alumno-data-val" style="font-size:.8rem">${l.ci}</div></div>
          <div><div class="alumno-data-label">Email</div><div class="alumno-data-val" style="font-size:.8rem">${l.email || '—'}</div></div>
          <div><div class="alumno-data-label">Teléfono</div><div class="alumno-data-val" style="font-size:.8rem">${l.telefono || '—'}</div></div>
        </div>
      </div>
    </div>
    ${l.titulos_descripcion ? `<div><div style="font-size:.72rem;font-weight:700;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">Títulos / Documentos</div>
    <div style="font-size:.83rem;color:var(--txt-secondary);background:var(--surface-2);border-radius:var(--radius);padding:10px 12px">${l.titulos_descripcion}</div></div>` : ''}
    ${l.observaciones ? `<div><div style="font-size:.72rem;font-weight:700;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px">Observaciones</div>
    <div style="font-size:.83rem;color:var(--txt-secondary);background:var(--surface-2);border-radius:var(--radius);padding:10px 12px">${l.observaciones}</div></div>` : ''}
    <div>
      <div style="font-size:.72rem;font-weight:700;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Cambiar estado</div>
      <select class="form-control" id="selEstadoLegajo">
        ${['Recibido', 'En revisión', 'Nota enviada', 'Alta aprobada', 'Rechazado'].map(e => `<option value="${e}" ${e === l.estado ? 'selected' : ''}>${e}</option>`).join('')}
      </select>
    </div>`;

      document.getElementById('drawerFooter').innerHTML = `
    <button class="btn btn-ghost" onclick="cerrarDrawer()">Cerrar</button>
    <button class="btn btn-primary btn-sm" onclick="guardarEstadoLegajo(${l.id})">Guardar estado</button>
    ${l.estado !== 'Alta aprobada' ? `<button class="btn btn-naranja btn-sm" onclick="aprobarAltaDocente(${l.id})">Aprobar alta → crear docente</button>` : ''}`;

      document.getElementById('drawerOverlay').classList.add('open');
    };

    // ── Acciones drawer ───────────────────────────────────────────
    window.cambiarEstado = async (id, nuevoEst) => {
      await supabase.from('solicitudes_secretaria').update({
        estado: nuevoEst,
        gestionado_por: sesion.id,
        fecha_resolucion: ['Completado', 'Rechazado'].includes(nuevoEst) ? new Date().toISOString() : null
      }).eq('id', id);
      toast(`Estado actualizado a: ${nuevoEst}`, 'success');
      cerrarDrawer();
      await cargarSolicitudes();
    };

    window.agregarSeguimiento = async (solicitudId) => {
      const estado = document.getElementById('nuevoEstadoSeg').value.trim();
      const obs = document.getElementById('obsNuevoEstado').value.trim();
      if (!estado) { toast('Ingresá el nuevo estado', 'warning'); return; }

      await supabase.from('seguimiento_titulo').insert({
        solicitud_id: solicitudId, estado_nuevo: estado,
        observacion: obs || null, registrado_por: sesion.id,
        fecha_cambio: new Date().toISOString()
      });
      toast('Seguimiento registrado', 'success');
      await abrirDrawer(solicitudId); // refresca
    };

    window.resolverConv = async (convId, nuevoEst) => {
      await supabase.from('convalidaciones_detalle').update({
        estado: nuevoEst, resuelto_por: sesion.id,
        fecha_resolucion: new Date().toISOString()
      }).eq('id', convId);

      if (nuevoEst === 'Aprobada') {
        // Obtener datos para insertar en historial_examenes
        const { data: conv } = await supabase.from('convalidaciones_detalle').select('*, solicitudes_secretaria(alumno_id)').eq('id', convId).single();
        if (conv) {
          const { data: insc } = await supabase.from('inscripciones_anuales').select('id')
            .eq('alumno_id', conv.solicitudes_secretaria.alumno_id).eq('estado', 'Activo').single();
          if (insc) {
            await supabase.from('historial_examenes').insert({
              inscripcion_id: insc.id, materia_id: conv.materia_id,
              oportunidad_nro: 1, estado_materia: 'Aprobado',
              nota_obtenida: conv.materia_origen_nota || null,
              registrado_por: sesion.id
            });
          }
        }
      }
      toast(`Convalidación ${nuevoEst.toLowerCase()}`, nuevoEst === 'Aprobada' ? 'success' : 'warning');
      await abrirDrawer(solicActiva.id);
    };

    async function buscarInscripcionRemota(termino) {
      const contenedor = document.getElementById('listaResultadosInscripcion');
      const txt = termino.trim();

      if (txt.length < 3) {
        contenedor.style.display = 'none';
        return;
      }

      // Buscamos inscripciones vigentes cruzando datos del alumno
      const { data, error } = await supabase
        .from('inscripciones_anuales')
        .select(`
      id, anho_lectivo, anho_cursada,
      alumnos!inner(nombres, apellidos, ci),
      cohortes(carreras(nombre))
    `)
        .eq('estado', 'Activo') // Solo alumnos con inscripción vigente
        .or(`nombres.ilike.%${txt}%,apellidos.ilike.%${txt}%,ci.ilike.%${txt}%`, { foreignTable: 'alumnos' })
        .limit(5); // Traer el top 5 para no saturar la vista

      if (error || !data || data.length === 0) {
        contenedor.innerHTML = '<div style="padding:10px; color:var(--txt-muted);">Sin resultados...</div>';
        contenedor.style.display = 'block';
        return;
      }

      contenedor.innerHTML = data.map(i => `
    <div class="opcion-inscripcion" onclick="seleccionarInscripcion(${i.id}, '${i.alumnos.nombres} ${i.alumnos.apellidos} — CI: ${i.alumnos.ci}')">

  `).join('');

    const { Table, TableRow, TableCell, BorderStyle, WidthType, ShadingType, ImportedXmlComponent } = docx;

    const buildDoc = (children, logoBuffer, watermark, opts = {}) => {
      const {
        borderRight = true,          // false = sin línea derecha (formato "raro" solicitado)
        borderColor = 'E65100',      // color de las 3-4 líneas del borde de página
        footerConPagina = false,     // true = agrega línea "Página X | Y" debajo del footer
        marcoExterno = false         // true = membrete y footer QUEDAN FUERA del marco (línea dibujada, no borde nativo)
      } = opts;

      // ── IMPORTANTE: en docx@8.5.0 el borde de página va anidado en
      // page.borders con las claves pageBorderTop/Right/Bottom/Left.
      // (Antes estaba como properties.pageBorders = {top,right,bottom,left}
      // y la librería lo ignoraba en silencio: nunca se dibujaba ningún borde).
      // Nota: el borde NATIVO de Word (pgBorders) SIEMPRE encierra header y
      // footer — no hay forma confiable de excluirlos con esta propiedad.
      // Por eso, cuando se pide "membrete y pie de página fuera del borde"
      // (marcoExterno) usamos el helper lineasMarco() en su lugar, que dibuja
      // el marco a mano con posición absoluta.
      const pageBorders = {
        pageBorderTop: { style: BorderStyle.SINGLE, size: 12, color: borderColor, space: 24 },
        pageBorderBottom: { style: BorderStyle.SINGLE, size: 12, color: borderColor, space: 24 },
        pageBorderLeft: { style: BorderStyle.SINGLE, size: 12, color: borderColor, space: 24 },
      };
      if (borderRight) {
        pageBorders.pageBorderRight = { style: BorderStyle.SINGLE, size: 12, color: borderColor, space: 24 };
      }

      const pageMargin = marcoExterno
        ? MARCO_MARGENES
        : { top: 1440, right: 1440, bottom: 1440, left: 1440 };

      const footerChildren = [
        new Paragraph({
          alignment: AlignmentType.CENTER,
          children: [
            new TextRun({ text: "Central: Gregorio Benítez y Alejo García  |  Tel.: 0541 42 197 - 0981 314 711  |  Villarrica – Paraguay", color: '9E9E9E', size: 16 })

                          align: "center",
                        },
                        verticalPosition: {
                          relative: "page",
                          align: "center",
                        },
                        wrap: {
                          type: "none",
                        },
                        behindText: true,
                      }
                    })
                  ]
                })
              ]

          // ── PIE DE PÁGINA NATIVO CON DATOS OFICIALES ──
          footers: {

    // ── Marco institucional de 3 líneas (arriba/izquierda/abajo) que queda
    // POR FUERA del membrete y del pie de página, en vez del borde nativo de
    // página de Word (que siempre encierra header y footer). Se dibuja como
    // un grupo de líneas con posición absoluta ANCLADAS A LA PÁGINA dentro
    // del encabezado — igual a como lo arma Word cuando uno dibuja líneas
    // sueltas manualmente. Requiere usar buildDoc con márgenes ampliados
    // (ver MARCO_MARGENES más abajo) para que el membrete y el footer
    // tengan lugar de sobra por fuera del marco.
    // Tamaño de hoja: Oficio 216 x 330 mm (= 8.5 x 13 in = 12240 x 18720 twips).
    // Antes estaba en A4 (11906 x 16838); las notas deben salir en Oficio.
    const PAGINA_ANCHO_TW = 12240;
    const PAGINA_ALTO_TW = 18720;

    const MARCO_MARGENES = {
      top: 2450, right: 1440, bottom: 1050, left: 1440, header: 400, footer: 400
    };
    // Distancia del borde de la hoja a las líneas verticales del marco.
    // Debe ser MENOR que MARCO_MARGENES.left/right (donde arranca el texto),
    // así el marco queda más afuera y el texto no le toca encima.
    const MARCO_INSET_HORIZONTAL = 850;

    const lineasMarco = ({ colorHex = 'FF6600', anchoLinea = 28575, conDerecha = false } = {}) => {
      const EMU = 914400, TWIP = 1440;
      const { top: marginTopTw, bottom: marginBottomTw } = MARCO_MARGENES;
      const insetTw = MARCO_INSET_HORIZONTAL;
      const pageWidthTw = PAGINA_ANCHO_TW, pageHeightTw = PAGINA_ALTO_TW;

      const cx = Math.round(((pageWidthTw - 2 * insetTw) / TWIP) * EMU);
      const bufferSuperiorIn = 0.15;
      const bufferInferiorIn = 0.15;
      const topOffsetEMU = Math.round(((marginTopTw / TWIP) - bufferSuperiorIn) * EMU);
      const bottomYIn = (pageHeightTw / TWIP) - (marginBottomTw / TWIP) + bufferInferiorIn;
      const cy = Math.round((bottomYIn - (topOffsetEMU / EMU)) * EMU);

      const lineXml = (name, idShape, x, y, w, h) => `
        <wps:wsp>
          <wps:cNvPr id="${idShape}" name="${name}"/>
          <wps:cNvCnPr><a:cxnSpLocks noChangeShapeType="1"/></wps:cNvCnPr>

            <a:prstGeom prst="line"><a:avLst/></a:prstGeom>

            <a:ln w="${anchoLinea}"><a:solidFill><a:srgbClr val="${colorHex}"/></a:solidFill><a:round/><a:headEnd/><a:tailEnd/></a:ln>

      // ── IDs grandes y fijos, lejos del rango que usa docx-js internamente
      // (que le pone id="1" a TODAS sus imágenes sin variar) para evitar que
      // Word detecte IDs duplicados y marque el archivo como corrupto.
      let lineas = lineXml('LineaSuperior', 900500001, 0, 0, cx, 0)
        + lineXml('LineaIzquierda', 900500002, 0, 0, 0, cy)
        + lineXml('LineaInferior', 900500003, 0, cy, cx, 0);

          xmlns:wps="http://schemas.microsoft.com/office/word/2010/wordprocessingShape"
          xmlns:wpg="http://schemas.microsoft.com/office/word/2010/wordprocessingGroup">

            <wp:simplePos x="0" y="0"/>
            <wp:positionH relativeFrom="page"><wp:posOffset>${Math.round((insetTw / TWIP) * EMU)}</wp:posOffset></wp:positionH>
            <wp:positionV relativeFrom="page"><wp:posOffset>${topOffsetEMU}</wp:posOffset></wp:positionV>
            <wp:extent cx="${cx}" cy="${cy}"/>
            <wp:effectExtent l="19050" t="19050" r="19050" b="19050"/>
            <wp:wrapNone/>
            <wp:docPr id="900500000" name="MarcoInstitucional"/>

                <wpg:wgp>
                  <wpg:cNvGrpSpPr><a:grpSpLocks/></wpg:cNvGrpSpPr>

                    <a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/><a:chOff x="0" y="0"/><a:chExt cx="${cx}" cy="${cy}"/></a:xfrm>
                  </wpg:grpSpPr>
                  ${lineas}
                </wpg:wgp>
              </a:graphicData>
            </a:graphic>
          </wp:anchor>
        </w:drawing>
      </w:r>`;

      // ── fromXmlString envuelve el resultado en un componente "raíz" sin

      // cuyo nodo superior no tiene 'name', y la librería lo serializa tal
      // cual como una etiqueta literal "<undefined>"). Por eso extraemos el
      // <w:r> real desde adentro (.root[0]) en vez de usar el wrapper.
      const importado = ImportedXmlComponent.fromXmlString(xml);

          new Paragraph({
            indent: { left: 720 }, spacing: { after: 280 }, children: [
              N('Solicitamos atentamente el procesamiento de las solicitudes de Certificado de Estudios, conforme a los procedimientos y requisitos establecidos por la institución.')
            ]
          }),
          new Paragraph({ children: [N('Para los fines pertinentes.')] }),
          EMPTY(),
          new Paragraph({ children: [N('- Se adjuntan solicitudes de los estudiantes.')] }),
          EMPTY(),
          despedida(), firma(firmaBuffer), EMPTY(),
        ], logoBuffer, aguaBuffer);
        nombreArchivo = `CERTIFICADO_${nSuffix}.docx`;

      } else if (tipo === 'titulo') {
        const cols = [900, 5426, 2700];
        const filas = alumnosOrdenados.map((a, i) => new TableRow({
          children: [
            dCell(String(i + 1), cols[0]),
            dCell(`${a.nombres} ${a.apellidos}`.toUpperCase(), cols[1]),
            dCell(a.ci, cols[2]),
          ]
        }));
        doc = buildDoc([
          ...encabezadoRector(),
          new Paragraph({
            indent: { left: 720 }, spacing: { after: 160, line: 360, lineRule: "auto" }, children: [
              N('Tengo el agrado de dirigirme a Usted y por su intermedio a quien corresponda, a fin de remitirle la '),
              B('SOLICITUD DE REGISTRO DE TÍTULOS'),
              N(` de los estudiantes del programa de `), B(carrera),
              N(` de la Universidad Privada del Guairá – UPG, Dirección de Educación a Distancia. A continuación, se detalla un resumen de la solicitud:`)
            ]
          }),
          new Paragraph({ spacing: { after: 80 }, children: [N('Carrera: '), B(carrera + '.')] }),
          new Paragraph({ spacing: { after: 80 }, children: [N('Cohorte: '), B(nroCohorte)] }),
          new Paragraph({ spacing: { after: 200 }, children: [N('Sección: '), B(seccion)] }),
          new Paragraph({
            spacing: { after: 120 }, children: [
              N('Los estudiantes han cumplido satisfactoriamente con todos los requisitos académicos y administrativos y desean solicitar el registro de sus títulos:')
            ]
          }),
          new Table({
            width: { size: 9026, type: WidthType.DXA }, columnWidths: cols,
            rows: [
              new TableRow({ children: [hCell('N°', cols[0]), hCell('NOMBRES Y APELLIDOS', cols[1]), hCell('C.I. N°', cols[2])] }),
              ...filas,
            ]
          }),
          EMPTY(),
          new Paragraph({
            indent: { left: 720 }, spacing: { after: 280 }, children: [
              N('Solicitamos atentamente el procesamiento y registro de los títulos de los estudiantes, conforme a los procedimientos y requisitos establecidos por la institución.')
            ]
          }),
          despedida(), firma(firmaBuffer), EMPTY(),
        ], logoBuffer, aguaBuffer, { borderRight: false, borderColor: 'FF6600', footerConPagina: true, marcoExterno: true });
        nombreArchivo = `TITULO_${nSuffix}.docx`;

      } else if (tipo === 'baja') {
        const cols = [600, 2100, 2100, 1200, 800, 800, 1026];
        const filas = alumnosOrdenados.map((a, i) => new TableRow({
          children: [
            dCell(String(i + 1), cols[0]),
            dCell(a.nombres.toUpperCase(), cols[1]),
            dCell(a.apellidos.toUpperCase(), cols[2]),
            dCell(a.ci, cols[3]),
            dCell('1', cols[4]),
            dCell(seccion, cols[5]),
            dCell(anho, cols[6]),
          ]
        }));
        doc = buildDoc([
          ...encabezadoDireccion(),
          new Paragraph({
            indent: { left: 720 }, spacing: { after: 200 }, children: [
              N('Me dirijo a usted y por su intermedio, a donde corresponda a fin de solicitar la '),
              B('BAJA'),
              N(` en el sistema GoodSystem de los estudiantes matriculados en el programa de `),
              B(`${carrera.toUpperCase()} — ${nroCohorte}`), N('.')
            ]
          }),
          new Paragraph({ spacing: { after: 120 }, children: [N('  Abajo se detallan los datos de los alumnos que solicitan la deserción:')] }),
          new Table({
            width: { size: 9026, type: WidthType.DXA }, columnWidths: cols,
            rows: [
              new TableRow({ children: [hCell('N°', cols[0]), hCell('NOMBRE/S', cols[1]), hCell('APELLIDO/S', cols[2]), hCell('CÉDULA', cols[3]), hCell('CURSO', cols[4]), hCell('SECCIÓN', cols[5]), hCell('AÑO', cols[6])] }),
              ...filas,
            ]
          }),
          EMPTY(),
          new Paragraph({ children: [N('- Se adjuntan notas de solicitud por parte de los alumnos.')] }),
          EMPTY(),
          despedida(), firma(firmaBuffer), EMPTY(),
        ], logoBuffer, aguaBuffer);
        nombreArchivo = `BAJA_${nSuffix}.docx`;

      } else if (tipo === 'convalidacion') {
        const { data: convsTodas } = await supabase
          .from('convalidaciones_detalle')
          .select('*, materias(nombre)')
          .in('solicitud_id', ids);

        const cols = [600, 2500, 2200, 1800, 926];
        const bloques = [];
        alumnosOrdenados.forEach((a, idx) => {
          const filasConv = (convsTodas || []).filter(c => c.solicitud_id === a.solicitudId);
          const filasTabla = (filasConv.length ? filasConv : [{ materias: { nombre: '—' }, institucion_origen: '—', materia_origen_nombre: '—', materia_origen_nota: null }])
            .map((c, i) => new TableRow({
              children: [
                dCell(String(i + 1), cols[0]),
                dCell(c.materias?.nombre || '—', cols[1]),
                dCell(c.institucion_origen || '—', cols[2]),
                dCell(c.materia_origen_nombre || '—', cols[3]),
                dCell(c.materia_origen_nota != null ? String(c.materia_origen_nota) : '—', cols[4]),
              ]
            }));

          if (idx > 0) bloques.push(EMPTY());
          bloques.push(new Paragraph({ spacing: { after: 100 }, children: [N('Alumno/a: '), B(`${a.nombres} ${a.apellidos}`.toUpperCase()), N('  CI: '), B(a.ci)] }));
          bloques.push(new Table({
            width: { size: 9026, type: WidthType.DXA }, columnWidths: cols,
            rows: [
              new TableRow({ children: [hCell('N°', cols[0]), hCell('MATERIA UPG', cols[1]), hCell('INSTITUCIÓN ORIGEN', cols[2]), hCell('MATERIA ORIGEN', cols[3]), hCell('NOTA', cols[4])] }),
              ...filasTabla,
            ]
          }));
        });

        doc = buildDoc([
          ...encabezadoRector(),
          new Paragraph({
            indent: { left: 720 }, spacing: { after: 160 }, children: [
              N('Tengo el agrado de dirigirme a Usted y por su intermedio a quien corresponda, a fin de remitirle la '),
              B('SOLICITUD DE CONVALIDACIÓN DE MATERIAS'),
              N(` de los estudiantes del programa de `), B(carrera),
              N(` de la Universidad Privada del Guairá – UPG, Filial Educación a Distancia. A continuación, se detalla un resumen de las solicitudes:`)
            ]
          }),
          new Paragraph({ spacing: { after: 80 }, children: [N('Carrera: '), B(carrera + '.')] }),
          new Paragraph({ spacing: { after: 80 }, children: [N('Cohorte: '), B(nroCohorte)] }),
          new Paragraph({ spacing: { after: 200 }, children: [N('Sección: '), B(seccion)] }),
          ...bloques,
          EMPTY(),
          new Paragraph({
            indent: { left: 720 }, spacing: { after: 280 }, children: [
              N('Solicitamos atentamente el análisis y resolución de las solicitudes de convalidación, conforme a los procedimientos y requisitos establecidos por la institución.')
            ]
          }),
          despedida(), firma(firmaBuffer), EMPTY(),
        ], logoBuffer, aguaBuffer);
        nombreArchivo = `CONVALIDACION_${nSuffix}.docx`;

      } else {
        toast('Tipo de solicitud sin plantilla de nota conjunta', 'warning');
        return;
      }

      try {
        const blob = await Packer.toBlob(doc);
        saveAs(blob, nombreArchivo);
        toast(`Nota conjunta generada: ${nombreArchivo} (${alumnosOrdenados.length} alumnos)`, 'success');

        if (tipo === 'titulo') {
          await supabase.from('seguimiento_titulo').insert(
            ids.map(id => ({
              solicitud_id: id,
              estado_nuevo: 'Nota generada',
              observacion: `Nota Word conjunta generada el ${new Date().toLocaleDateString('es-PY')}`,
              registrado_por: sesion.id,
              fecha_cambio: new Date().toISOString()
            }))
          );
        }

        seleccionadas.clear();
        document.getElementById('chkTodas').checked = false;
        actualizarBarraSeleccion();
        renderSolicitudes();
      } catch (err) {
        toast('Error al generar el documento conjunto: ' + err.message, 'error');
        console.error(err);
      }
    };
  </script>
</body>

</html>
